<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhar transporte · GF</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#0F172A;--ink2:#334155;--muted:#64748B;--line:#E2E8F0;--azul:#2563EB;--azul2:#1E40AF;--soft:#EFF6FF;--ok:#15803D;--oksoft:#DCFCE7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Inter Tight',system-ui,sans-serif}
header{background:#0F172A;color:#fff;padding:14px max(16px,env(safe-area-inset-left)) 14px;display:flex;align-items:center;gap:12px}
header img{height:30px}
header span{font-weight:700;font-size:15px;color:#CBD5E1}
main{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0}
.meta{color:var(--muted);font-size:15px;margin-top:6px}
.st{display:inline-block;margin-top:12px;background:var(--soft);color:var(--azul2);font-weight:800;border-radius:99px;padding:6px 14px}
.st.ok{background:var(--oksoft);color:var(--ok)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:0}
ol li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);color:var(--muted)}
ol li:first-child{border-top:0}
ol li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:block}
ol li.feito{color:var(--ink)}ol li.feito i{background:var(--azul);border-color:var(--azul)}
ol li.atual{color:var(--ink);font-weight:800}ol li.atual i{border-color:var(--azul);box-shadow:0 0 0 4px var(--soft)}
ol time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{display:block;text-align:center;background:linear-gradient(180deg,#3B82F6,var(--azul2));color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:14px;margin-top:12px}
.g b{display:block;font-size:18px}
.ok-cod{color:var(--ok);font-weight:700;margin-top:8px}
.vazio{text-align:center;color:var(--muted);padding:40px 10px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px}
footer a{color:var(--azul2)}
</style>
</head>
<body>
<header><img src="/assets/gf-mark.png" alt="GF Guincho Fácil"><span>Acompanhar transporte</span></header>
<main id="m"><div class="vazio">Carregando…</div></main>
<footer>GF · Guincho Fácil · <a href="https://appdoguincheiro.com">appdoguincheiro.com</a></footer>
<script src="/config.js"></script>
<script>
(function () {
  var NOMES = { aceito: 'Guincheiro escolhido', a_caminho: 'A caminho da retirada', no_local: 'No local da retirada', em_transporte: 'Em transporte', concluido: 'Entregue' };
  var ORDEM = ['aceito', 'a_caminho', 'no_local', 'em_transporte', 'concluido'];
  var m = document.getElementById('m');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hora(t) { var d = new Date(t); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  var t = new URLSearchParams(location.search).get('t');
  if (!t || !/^[0-9a-f-]{36}$/i.test(t)) { m.innerHTML = '<div class="vazio"><b>Link inválido.</b><br>Peça um novo link a quem mandou.</div>'; return; }
  function carrega() {
    fetch(GF_CONFIG.supabaseUrl + '/rest/v1/rpc/gf_acompanhar', { method: 'POST',
      headers: { apikey: GF_CONFIG.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: t }) })
      .then(function (r) { return r.json(); }).then(desenha)
      .catch(function () { m.innerHTML = '<div class="vazio">Sem conexão. Tentando de novo…</div>'; });
  }
  function desenha(d) {
    if (!d || d.code) { m.innerHTML = '<div class="vazio"><b>Este acompanhamento não está disponível.</b><br>O atendimento pode ter sido encerrado ou o link mudou.</div>'; return; }
    var em = {}; (d.etapas || []).forEach(function (e) { em[e.status] = e.em; });
    em.aceito = em.aceito || d.aceito_em;
    var i = ORDEM.indexOf(d.status);
    var etapas = ORDEM.map(function (s, k) {
      var cls = k < i || d.status === 'concluido' ? 'feito' : k === i ? 'atual' : '';
      return '<li class="' + cls + '"><i></i><span>' + NOMES[s] + '</span><time>' + (em[s] && k <= i ? hora(em[s]) : '') + '</time></li>';
    }).join('');
    var loc = d.local ? '<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=' + d.local.lat + ',' + d.local.lng + '">Ver onde está o guincho</a>'
      + '<div class="meta" style="text-align:center">Posição de ' + hora(d.local.em) + '</div>' : '';
    m.innerHTML = '<div class="card"><h1>' + esc(d.origem) + ' › ' + esc(d.destino) + '</h1><div class="meta">' + esc(d.veiculo) + '</div>'
      + '<span class="st ' + (d.status === 'concluido' ? 'ok' : '') + '">' + NOMES[d.status] + '</span>'
      + (d.chegada_confirmada_em ? '<div class="ok-cod">✓ Chegada confirmada pelo código às ' + new Date(d.chegada_confirmada_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '</div>' : '')
      + loc + '</div>'
      + '<div class="card"><ol>' + etapas + '</ol></div>'
      + '<div class="card g"><div class="meta" style="margin:0">Guincheiro</div><b>' + esc(d.guincheiro) + (d.empresa ? ' · ' + esc(d.empresa) : '') + '</b>'
      + '<div class="meta">' + esc(d.equipamento || '') + (d.placa ? ' · placa ' + esc(d.placa) : '') + '</div></div>';
  }
  carrega(); setInterval(function () { if (!document.hidden) carrega(); }, 30000);
})();
</script>
</body>
</html>

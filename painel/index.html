<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Central 24h JM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sidebar navy fixa (desktop) / barra inferior (celular); área branca de operação, estilo app bancário */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#F0F2F6; --fg:#0E1A2B; --muted:#5B6676; --line:#E2E6EC;
  --navy:#0F3460; --gold:#D4A24C; --gold-ink:#8A6420; --bar:#0F3460;
  --primary:#0F3460; --on-primary:#FFFFFF; --side:#0F3460; --side-fg:#DCE5F2; --side-muted:#8EA3C2; --side-active:#1B4A82;
  --ok:#1F8A5B; --ok-bg:#E6F4EC; --warn:#A86A12; --warn-bg:#FBF0DC; --bad:#BE3B34; --bad-bg:#FBE7E5; --info:#2A66A8; --info-bg:#E5EEF8;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 8px 24px rgba(14,26,43,.06);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111E; --surface:#111A2A; --surface-2:#172235; --fg:#E7ECF3; --muted:#93A0B4; --line:#223049;
  --gold-ink:#E2B865; --bar:#D4A24C; --primary:#D4A24C; --on-primary:#1A1405; --side:#0C1628; --side-fg:#DCE5F2; --side-muted:#7F93B3; --side-active:#1A2B48;
  --ok:#4CC08A; --ok-bg:#12301F; --warn:#E3A84A; --warn-bg:#33260F; --bad:#F07A72; --bad-bg:#3A1816; --info:#7FB0EA; --info-bg:#132A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111E; --surface:#111A2A; --surface-2:#172235; --fg:#E7ECF3; --muted:#93A0B4; --line:#223049;
  --gold-ink:#E2B865; --bar:#D4A24C; --primary:#D4A24C; --on-primary:#1A1405; --side:#0C1628; --side-fg:#DCE5F2; --side-muted:#7F93B3; --side-active:#1A2B48;
  --ok:#4CC08A; --ok-bg:#12301F; --warn:#E3A84A; --warn-bg:#33260F; --bad:#F07A72; --bad-bg:#3A1816; --info:#7FB0EA; --info-bg:#132A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#1A1405;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.brand b{display:block;font-size:15px;color:#fff;letter-spacing:-.01em}
.brand small{color:var(--side-muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--side-fg);font-weight:600;font-size:13.5px}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff}
.nav button[aria-current="page"] svg{stroke:var(--gold);opacity:1}
.nav .count{margin-left:auto;background:var(--gold);color:#1A1405;font-size:11px;font-weight:800;border-radius:20px;padding:1px 7px}
.nav .count.late{background:#F07A72;color:#2A0805}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:var(--warn)}

main{padding-block:28px 48px;padding-inline:32px;min-width:0;max-width:1320px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1405}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1440px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--warn);background:var(--warn-bg)}
.kpi.alert .v{color:var(--warn)}
.kpi.bad{border-color:var(--bad);background:var(--bad-bg)}
.kpi.bad .v{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.panel-h .sub{color:var(--muted);font-size:12.5px}
.panel-b{padding:14px 18px}
.stack{display:flex;flex-direction:column;gap:18px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tbody tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
td .t1{font-weight:700}
td .t2{color:var(--muted);font-size:12.5px}
.r{text-align:right}
th.r{text-align:right}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-aberto,.cr-em_analise{background:var(--warn-bg);color:var(--warn)}
.st-despachado,.st-a_caminho,.st-no_local{background:var(--info-bg);color:var(--info)}
.st-concluido,.cr-aprovado{background:var(--ok-bg);color:var(--ok)}
.st-cancelado{background:var(--surface-2);color:var(--muted)}
.cr-suspenso{background:var(--bad-bg);color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:6px;padding:1px 6px}
.urg{color:var(--bad);font-weight:800;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.sla{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sla.ok{background:var(--ok-bg);color:var(--ok)}
.sla.risk{background:var(--warn-bg);color:var(--warn)}
.sla.late{background:var(--bad-bg);color:var(--bad)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.input,select.input,textarea.input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:70px}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.search{max-width:280px;flex:1 1 200px}

.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.bar .track{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--bar);border-radius:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--gold-ink);flex:none}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{color:var(--muted);font-size:12px}

/* Drawer e modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,26,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line)}
.drawer-h{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-h .grow{flex:1;min-width:0}
.drawer-h h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.drawer-b{overflow-y:auto;padding:18px 20px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.steps{display:flex;gap:4px}
.steps .s{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.steps .s i{height:5px;border-radius:4px;background:var(--surface-2)}
.steps .s.done i{background:var(--ok)}
.steps .s.cur i{background:var(--gold)}
.steps .s span{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .s small{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.flabel{font-size:12px;font-weight:700;color:var(--muted)}
.f .hint,.hint{font-size:11.5px;color:var(--muted)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.money div{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.money span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.money b{font-size:17px;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:4px}
.stars button{all:unset;cursor:pointer;font-size:24px;line-height:1;color:var(--line)}
.stars button.on{color:var(--gold)}
.timeline{display:flex;flex-direction:column;gap:10px;font-size:13px}
.timeline div{display:flex;gap:10px}
.timeline time{color:var(--muted);min-width:96px;font-family:var(--f-mono);font-size:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--navy);flex:none}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%;box-sizing:border-box}
.chip:hover{border-color:var(--gold)}
.chip b{font-size:13px}
.chip span{font-size:11.5px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-2);position:relative;max-width:100%}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs small{position:absolute;left:4px;bottom:4px;background:rgba(8,14,26,.72);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sigpad{width:100%;height:200px;border:1px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;display:block}
.sigimg{background:#fff;border-radius:8px;border:1px solid var(--line);max-height:110px;max-width:100%}
.docs{display:flex;gap:5px;flex-wrap:wrap}
.doc{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted)}
.doc.ok{background:var(--ok-bg);color:var(--ok)}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--bar)}
.chart .bc{fill:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);z-index:42;border-radius:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal form{display:flex;flex-direction:column;min-height:0}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{margin:0;font-size:17px;font-weight:800}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;margin-bottom:16px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.lb{position:fixed;inset:0;background:rgba(8,14,26,.82);z-index:55;display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:86vh;border-radius:8px}
.group{border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.group-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.group-h b{font-size:14.5px}
.muted{color:var(--muted)}
.nw{white-space:nowrap}
.only-sm{display:none;margin-top:4px}
.due-ok{background:var(--ok-bg);color:var(--ok)}
.due-warn{background:var(--warn-bg);color:var(--warn)}
.due-bad{background:var(--bad-bg);color:var(--bad)}
.due-n{background:var(--surface-2);color:var(--muted)}

@media (max-width:980px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;gap:0}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;font-size:10px;padding:6px 2px;flex:1;justify-content:center;text-align:center;position:relative;min-width:0}
  .nav .count{position:absolute;top:0;right:12%;margin:0;font-size:10px;padding:0 5px}
  main{padding-inline:16px;padding-block:18px 96px}
  .head h1{font-size:22px}
  .fgrid,.checks{grid-template-columns:1fr}
  .kv{grid-template-columns:96px 1fr}
  .hide-sm{display:none}
  .only-sm{display:block}
  td{padding:10px 8px}
  th{padding:8px}
  .group-h{padding:12px 8px}
  .kpis,.kpis.six{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:21px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">24h</div><div><b>Central 24h</b><small>JM Auto Socorro</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span id="conn"><span class="dot"></span>Salvo neste aparelho</span><span>Alegrete · São Gabriel · Bagé</span></div>
  </aside>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- Referências ---------- */
const SERVICOS = ["Reboque / guincho","Transporte em prancha","Remoção de sinistro","Carga de bateria","Troca de pneu","Pane seca","Chaveiro automotivo","Mecânico no local","Resgate / veículo atolado"];
const FILIAIS = ["Alegrete","São Gabriel","Bagé"];
const SLA_PADRAO = {normal:60, urgente:40};
const CRED = {em_analise:"Em análise", aprovado:"Aprovado", suspenso:"Suspenso"};
const DOCS = [["cnh","CNH"],["crlv","CRLV"],["seguro","Seguro RCF"],["cnpj","CNPJ/MEI"],["contrato","Contrato"]];
const CHECK = [["laterais","Fotos das 4 laterais"],["avarias","Avarias anotadas"],["chave","Chave recebida"],["documento","Documento no veículo"],["pertences","Pertences conferidos"],["amarracao","Amarração conferida"]];
const COMBUST = ["Reserva","1/4","1/2","3/4","Cheio"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const numIn = v => { if(typeof v==="number") return isFinite(v)?v:0; let s = String(v??"").trim().replace(/[R$\s]/g,""); if(!s) return 0; if(s.includes(",")) s = s.replace(/\./g,"").replace(",","."); const n = Number(s); return isFinite(n)?n:0; };
const num = numIn;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2,"0");

const ymKey = d => { const x = new Date(d); return x.getFullYear()+"-"+pad(x.getMonth()+1); };
const sameDay = (a,b) => new Date(a).toDateString()===new Date(b).toDateString();
const hm = iso => { const d=new Date(iso); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
const hhmm = t => { const d=new Date(t); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fmtMin = m => m<60 ? m+" min" : Math.floor(m/60)+"h"+(m%60?pad(m%60):"");
const ago = iso => { if(!iso) return ""; const m = Math.max(0,Math.round((Date.now()-new Date(iso))/60000)); if(m<1) return "agora"; if(m<60) return "há "+m+" min"; const h=Math.floor(m/60); if(h<24) return "há "+h+" h"+(m%60?" "+(m%60)+" min":""); return "há "+Math.floor(h/24)+" d"; };
const initials = s => String(s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const digits = s => String(s||"").replace(/\D/g,"");
const waNum = s => { let d = digits(s); if(!d) return ""; if(d.length<=11) d = "55"+d; return d; };
const waLink = (tel, text) => { const n = waNum(tel); return n ? "https://wa.me/"+n+"?text="+encodeURIComponent(text) : ""; };

const DIA = 86400000;
const addDias = (iso, d) => iso ? new Date(new Date(iso).getTime() + d*DIA).toISOString() : null;
const diasPara = iso => { const a=new Date(iso); a.setHours(12,0,0,0); const b=new Date(); b.setHours(12,0,0,0); return Math.round((a-b)/DIA); };
const isoData = iso => { if(!iso) return ""; const d = new Date(iso); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const dataISO = v => v ? new Date(v+"T12:00:00").toISOString() : null;

function duePill(iso, ok, okTxt){
  if(ok) return `<span class="pill due-ok">${okTxt}</span>`;
  if(!iso) return '<span class="pill due-n">Sem prazo</span>';

  if(d<0) return `<span class="pill due-bad">Vencido há ${-d}d</span>`;
  if(d===0) return '<span class="pill due-warn">Vence hoje</span>';

  const x = new Date(iso); return `<span class="pill due-n">${pad(x.getDate())}/${pad(x.getMonth()+1)}</span>`;
}

/* ---------- Regras de negócio ---------- */
const prazoMin = c => Number(c.prazoMin) || (c.clienteId && num((byId("clientes",c.clienteId)||{}).slaMin)) || SLA_PADRAO[c.prioridade] || 60;
function sla(c){
  if(!c || c.status==="cancelado" || !c.criadoEm) return null;
  const lim = new Date(c.criadoEm).getTime() + prazoMin(c)*60000;
  const cheg = evTime(c,"no_local");
  if(cheg){ const late = new Date(cheg).getTime() > lim; return {fim:true, late, lim, txt: late?"Chegou fora do prazo":"Chegou no prazo", cls: late?"late":"ok"}; }
  if(c.status==="concluido") return {fim:true, late:false, lim, txt:"Sem registro de chegada", cls:"risk", semReg:true};
  const rest = Math.round((lim-Date.now())/60000);
  if(rest<0) return {late:true, lim, txt:"Atrasado "+fmtMin(-rest), cls:"late"};
  return {late:false, lim, txt:"Faltam "+fmtMin(rest), cls: rest<=15?"risk":"ok"};
}
const atrasado = c => { if(!ATIVO(c.status)) return false; const s=sla(c); return !!(s && s.late); };
function metr(list){
  const conc = list.filter(c=>c.status==="concluido"), canc = list.filter(c=>c.status==="cancelado");
  const sl = conc.map(sla).filter(x=>x && !x.semReg); const noPrazo = sl.length ? sl.filter(x=>!x.late).length/sl.length : null;
  const ch = conc.map(chegadaMin).filter(x=>x!=null);
  const notas = conc.map(c=>c.avaliacao&&c.avaliacao.nota).filter(Boolean);
  const receita = conc.reduce((a,c)=>a+num(c.valorCliente),0), custo = conc.reduce((a,c)=>a+num(c.valorPrestador),0);
  const recl = conc.filter(c=>c.reclamacao).length;
  const notaM = notas.length ? notas.reduce((a,b)=>a+b,0)/notas.length : null;
  let score = null;
  if(conc.length) score = Math.max(0, Math.round(100*(0.45*(notaM!=null?notaM/5:0.8) + 0.45*(noPrazo!=null?noPrazo:0.8) + 0.10) - Math.min(30, recl/conc.length*100)));
  return { total:list.length, conc:conc.length, canc:canc.length, noPrazo, chegMed: ch.length?Math.round(ch.reduce((a,b)=>a+b,0)/ch.length):null, notaM, receita, custo, margem:receita-custo, recl, score,
    apagar: conc.filter(c=>!c.pagoPrestador).reduce((a,c)=>a+num(c.valorPrestador),0) };
}
const statsPrest = p => metr(S.chamados.filter(c=>c.prestadorId===p.id));
const docsOk = p => DOCS.filter(([k])=>p.docs && p.docs[k]).length;
const apto = p => p.ativo!==false && (p.tipo!=="parceiro" || p.credenciamento==="aprovado");
const custoParceiro = (p,c) => (num(p.saida)||num(p.valorKm)) ? num(p.saida) + num(c.km)*num(p.valorKm) : null;
/* Tabela de preço: a do cliente (se tiver) ou a tabela padrão para particular */
function tabela(clienteId){
  const cl = clienteId && byId("clientes", clienteId);
  if(cl && (num(cl.saida) || num(cl.valorKm))) return { saida:num(cl.saida), km:num(cl.valorKm), franquia:num(cl.franquia), nome:"Tabela "+cl.nome };
  if(num(CFG.tabSaida) || num(CFG.tabKm)) return { saida:num(CFG.tabSaida), km:num(CFG.tabKm), franquia:num(CFG.tabFranquia), nome:"Tabela padrão" };
  return null;
}
const valorTabela = (t, km) => Math.round((t.saida + Math.max(0, num(km) - t.franquia) * t.km) * 100) / 100;
/* Recalcula o repasse quando muda o valor, desde que o repasse ainda seja o calculado pela comissão (não mexe em valor digitado à mão) */
function ajustarRepasse(antes, n){
  const p = n.prestadorId && byId("prestadores", n.prestadorId); if(!p) return;
  const velho = comissao(antes, p), novo = comissao(n, p);
  if(novo != null && (!num(n.valorPrestador) || Math.abs(num(n.valorPrestador) - (velho ?? -1)) < 0.01)) n.valorPrestador = novo;
}
/* Comissão do parceiro: % sobre o valor do km (valor ao cliente menos a saída); a saída fica com a JM, entra na divisão ou vai para o parceiro */
const SAIDA_FICA = {empresa:"saída fica com a JM", divide:"saída entra na divisão", parceiro:"saída fica com o parceiro"};
function comissao(c, p){
  if(!p || !num(p.comissaoPct)) return null;
  const total = num(c.valorCliente), saida = Math.min(num(c.saida), total), km = total - saida;
  const v = (km + (p.saidaFica==="divide" ? saida : 0)) * num(p.comissaoPct)/100 + (p.saidaFica==="parceiro" ? saida : 0);
  return Math.round(v*100)/100;
}
const prazoReceber = c => { if(c.vencReceber) return c.vencReceber; const cl = c.clienteId && byId("clientes",c.clienteId); return cl && cl.prazo ? addDias(dataRef(c), num(cl.prazo)) : null; };
const prazoPagar = c => { if(c.vencPagar) return c.vencPagar; const p = c.prestadorId && byId("prestadores",c.prestadorId); return p && p.prazoPag!=null ? addDias(dataRef(c), num(p.prazoPag)) : null; };
const finVencidos = () => S.chamados.filter(c=>c.status==="concluido").reduce((a,c)=>a + (!c.recebido && vencidoISO(prazoReceber(c)) ? 1 : 0) + (c.prestadorId && !c.pagoPrestador && vencidoISO(prazoPagar(c)) ? 1 : 0), 0);
function sugestoes(c){
  const ocup = new Set(S.chamados.filter(x=>ATIVO(x.status) && x.id!==c.id).map(x=>x.prestadorId).filter(Boolean));
  const alvo = norm((c.filial||"")+" "+(c.origem||""));
  const palavras = norm(c.servico).split(/[\s/]+/).filter(w=>w.length>3);
  return S.prestadores.filter(apto).map(p=>{
    const cidades = [p.cidade].concat(String(p.cidadesAtendidas||"").split(/[,;]/)).map(norm).filter(Boolean);
    const local = cidades.some(ci=>alvo.includes(ci));
    const serv = norm(p.servicos); const sv = !serv || palavras.some(w=>serv.includes(w));
    const st = statsPrest(p), livre = !ocup.has(p.id);
    return {p, local, sv, livre, st, custo: custoParceiro(p,c), pts:(local?40:0)+(sv?20:0)+(livre?25:0)+((st.score!=null?st.score:70)/100*15)};
  }).sort((a,b)=>b.pts-a.pts).slice(0,3);
}

function toast(msg, kind){ const t=$("#toast"); t.textContent=msg; t.className="toast"+(kind==="bad"?" bad":""); t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 3400); }
function errMsg(e){ const c=e&&e.code; if(c==="invalid_argument") return "Você não tem permissão para alterar estes dados."; if(c==="quota_exceeded") return "Limite de armazenamento atingido. Exclua registros antigos."; if(c==="resource_exhausted") return "Muitas alterações seguidas. Aguarde alguns segundos."; return "Não foi possível salvar. Tente de novo."; }
function assetErr(e){ const c=e&&e.code; if(c==="too_large") return "Foto grande demais (máx. 20 MB)."; if(c==="unsupported_type") return "Formato não aceito. Use foto JPG ou PNG."; if(c==="quota_or_state") return "Espaço de fotos esgotado."; if(c==="rate_limited") return "Muitos envios seguidos. Aguarde e tente de novo."; return "Não foi possível enviar a foto."; }

async function save(col, obj){
  const o = clone(obj); const id = o.id; delete o.id; o.atualizadoEm = nowISO();
  if(DB){ try{ await DB.collection(col).doc(id).set(o); }catch(e){ toast(errMsg(e),"bad"); throw e; } }
  else { LOCAL[col].set(id,{id,...o}); S[col]=[...LOCAL[col].values()]; persistir(); render(); }
}
async function remove(col, id){
  if(DB){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ toast(errMsg(e),"bad"); throw e; } }
  else { LOCAL[col].delete(id); S[col]=[...LOCAL[col].values()]; persistir(); render(); }
}
async function patchChamado(id, fn){ const c = byId("chamados",id); if(!c) return; const n = clone(c); fn(n); await save("chamados", n); }

function vPainel(){
  const hoje = Date.now(), mes = ymKey(hoje);
  const ativos = S.chamados.filter(c=>ATIVO(c.status)).sort((a,b)=> (atrasado(b)-atrasado(a)) || (a.criadoEm>b.criadoEm?1:-1));
  const abertos = ativos.filter(c=>c.status==="aberto").length;
  const atras = ativos.filter(atrasado).length;
  const concHoje = S.chamados.filter(c=>c.status==="concluido" && sameDay(dataRef(c),hoje)).length;
  const doMes = S.chamados.filter(c=>ymKey(c.criadoEm)===mes);
  const m = metr(doMes);
  const porF = FILIAIS.map(f=>[f, doMes.filter(c=>c.filial===f && c.status!=="cancelado").length]);
  const maxF = Math.max(1,...porF.map(x=>x[1]));

function vChamados(){

  if(q) list = list.filter(c=>norm([c.protocolo,c.segurado,c.placa,c.origem,c.destino,c.telefone,c.servico].join(" ")).includes(q));

function periodo(){
  const now = new Date(); let ini, fim = now;
  if(S.per==="7d"){ ini = new Date(now); ini.setDate(ini.getDate()-6); ini.setHours(0,0,0,0); }
  else if(S.per==="30d"){ ini = new Date(now); ini.setDate(ini.getDate()-29); ini.setHours(0,0,0,0); }
  else if(S.per==="mes"){ ini = new Date(now.getFullYear(), now.getMonth(), 1); }
  else { ini = new Date(now.getFullYear(), now.getMonth()-1, 1); fim = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59); }
  return {ini, fim};
}
function chartDias(list, ini, fim){
  const dias = []; const d = new Date(ini); d.setHours(0,0,0,0);
  while(d <= fim && dias.length < 62){ dias.push(new Date(d)); d.setDate(d.getDate()+1); }
  const vals = dias.map(x=>{ const ds = list.filter(c=>sameDay(c.criadoEm,x)); return [ds.filter(c=>c.status!=="cancelado").length, ds.filter(c=>c.status==="cancelado").length]; });
  const max = Math.max(1, ...vals.map(v=>v[0]+v[1]));
  const top = max<=4 ? max : Math.ceil(max/4)*4;
  const W=640, H=190, L=30, B=24, T=10, cw=(W-L-6)/dias.length, bw=Math.max(3, Math.min(22, cw*0.62));
  const y = v => T + (H-T-B) * (1 - v/top);
  const ticks = [0, top/2, top].filter((v,i,a)=>a.indexOf(v)===i && Number.isInteger(v));
  const every = Math.ceil(dias.length/10);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chamados por dia">
    ${ticks.map(t=>`<line class="gl" x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join("")}
    ${vals.map((v,i)=>{ const x = L + i*cw + (cw-bw)/2; const h1 = (H-T-B)*v[0]/top, h2 = (H-T-B)*v[1]/top;
      return (v[0]?`<rect class="b" x="${x.toFixed(1)}" y="${(y(v[0]+v[1])+h2).toFixed(1)}" width="${bw.toFixed(1)}" height="${h1.toFixed(1)}" rx="2"><title>${pad(dias[i].getDate())}/${pad(dias[i].getMonth()+1)}: ${v[0]} chamados</title></rect>`:"")
        + (v[1]?`<rect class="bc" x="${x.toFixed(1)}" y="${y(v[0]+v[1]).toFixed(1)}" width="${bw.toFixed(1)}" height="${h2.toFixed(1)}" rx="2"><title>${v[1]} cancelados</title></rect>`:"")
        + (i%every===0?`<text x="${(L+i*cw+cw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${pad(dias[i].getDate())}/${pad(dias[i].getMonth()+1)}</text>`:""); }).join("")}
  </svg>`;
}
function tabelaAgg(titulo, grupos, nomeCol){

  return `<section class="panel"><div class="panel-h"><h2>${titulo}</h2></div>${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>${nomeCol}</th><th class="r">Chamados</th><th class="r">Cancel.</th><th class="r">No prazo</th><th class="r">Chegada</th><th class="r">Receita</th><th class="r">Margem</th></tr></thead><tbody>${rows.map(([n,m])=>`<tr><td class="t1">${esc(n)}</td><td class="r num">${m.total}</td><td class="r num">${m.total?Math.round(m.canc/m.total*100)+"%":"—"}</td><td class="r num">${pct(m.noPrazo)}</td><td class="r num">${m.chegMed!=null?m.chegMed+" min":"—"}</td><td class="r num">${brl(m.receita)}</td><td class="r num">${m.receita?Math.round(m.margem/m.receita*100)+"%":"—"}</td></tr>`).join("")}</tbody></table></div>`:emptyBox("Sem dados no período","")}</section>`;
}

    <div class="kpi ${vencP+vencR?"bad":""}"><span class="l">Prazos vencidos</span><span class="v">${vencP+vencR}</span><span class="s">${vencP+vencR?"Resolver hoje":"Tudo em dia"}</span></div>

    </section>
  </div>

}

/* ---------- Mensagens ---------- */
function msgPrestador(c){
  const cl = c.clienteId?byId("clientes",c.clienteId):null; const s = sla(c);
  return [`*Acionamento ${c.protocolo}*`, `Serviço: ${c.servico}${c.prioridade==="urgente"?" — URGENTE":""}`,
    `Cliente: ${cl?cl.nome:"Particular"}`, `Segurado: ${c.segurado||"-"}`, `Telefone: ${c.telefone||"-"}`,
    c.placa?`Veículo/placa: ${c.placa}`:"", `Origem: ${c.origem||"-"}`, c.destino?`Destino: ${c.destino}`:"",
    c.origem?`Rota: ${mapsLink(c.origem,c.destino)}`:"", s&&!s.fim?`Chegar até: ${hhmm(s.lim)}`:"", c.valorPrestador?`Valor combinado: ${brl(c.valorPrestador)}`:"", c.obs?`Obs: ${c.obs}`:"",
    "", "Na coleta e na entrega: fotos das 4 laterais, avarias e painel (km e combustível). Colha a assinatura de quem receber.",
    "Confirme o recebimento e a previsão de chegada."].filter(x=>x!=="").join("\n");
}
function msgSegurado(c){
  const p = c.prestadorId?byId("prestadores",c.prestadorId):null; const s = sla(c);
  const st = {aberto:`foi registrado. Estamos localizando o prestador mais próximo${s&&!s.fim?" e a previsão é chegar até "+hhmm(s.lim):""}.`,despachado:`foi despachado para ${p?p.nome:"nosso prestador"}${p&&p.veiculo?" ("+p.veiculo+")":""}${s&&!s.fim?", previsão de chegada até "+hhmm(s.lim):""}.`,a_caminho:`está a caminho. Prestador: ${p?p.nome:"-"}.`,no_local:"o prestador chegou ao local.",concluido:"foi concluído. Obrigado por confiar na nossa central. De 1 a 5, que nota você dá para o atendimento?",cancelado:"foi cancelado."}[c.status]||"";
  return `Olá${c.segurado?", "+c.segurado.split(" ")[0]:""}! Seu atendimento ${c.protocolo} (${c.servico}) ${st}`;
}
const CONVITE = ["*Credenciamento — Rede de Parceiros JM Auto Socorro 24h*","","Estamos ampliando nossa rede de guincho e socorro veicular na Fronteira Oeste e Campanha (Alegrete, São Gabriel, Bagé e região).","","*Para se credenciar, envie:*","• CNH compatível e CRLV de cada veículo","• Apólice de seguro RCF do guincho","• CNPJ ou MEI e chave PIX","• Cidades que atende e tipos de serviço (guincho leve, prancha, pesado, bateria, pneu, chaveiro)","• Sua tabela: valor de saída e valor por km","","*Como trabalhamos:*","• Acionamento pelo WhatsApp com protocolo, endereço e rota","• Prazo de chegada definido em cada chamado","• Fotos na coleta e na entrega, com assinatura de quem recebe","• Avaliação de cada atendimento: quem tem boa nota e chega no prazo recebe mais chamados","• Pagamento direto via PIX, no prazo combinado","","Responda esta mensagem com os documentos para começar."].join("\n");
function fechamento(cid){
  const cl = byId("clientes",cid); const arr = S.chamados.filter(c=>c.status==="concluido"&&!c.recebido&&(c.clienteId||"_")===cid);
  const tot = arr.reduce((a,c)=>a+num(c.valorCliente),0);
  return [`*Fechamento — ${cl?cl.nome:"Particular"}*`, ...arr.map(c=>`${c.protocolo} · ${hm(dataRef(c)).slice(0,5)} · ${c.servico} · ${c.segurado||""}${c.placa?" · "+c.placa:""} · ${c.km?c.km+" km · ":""}${brl(c.valorCliente)}`), `Total: ${brl(tot)} (${arr.length} atendimentos)`].join("\n");
}
function msgRepasse(pid){
  const p = byId("prestadores",pid);
  const arr = S.chamados.filter(c=>c.status==="concluido"&&c.prestadorId===pid&&!c.pagoPrestador).sort((a,b)=>dataRef(a)<dataRef(b)?-1:1);
  const tot = arr.reduce((a,c)=>a+num(c.valorPrestador),0);
  return [`*Fechamento de repasse — ${p?p.nome:""}*`, ...arr.map(c=>`${c.protocolo} · ${hm(dataRef(c)).slice(0,5)} · ${c.servico}${c.origem?" · "+[c.origem,c.destino].filter(Boolean).join(" → "):""}${c.km?" · "+c.km+" km":""} · total ${brl(c.valorCliente)} → sua parte ${brl(c.valorPrestador)}`), `*Total a receber: ${brl(tot)}*`, p&&p.pix?`PIX: ${p.pix}`:""].filter(Boolean).join("\n");
}

      <select class="input" id="d-prest"><option value="">Selecione o prestador…</option>${prestOpts.map(x=>`<option value="${esc(x.id)}" ${x.id===c.prestadorId?"selected":""}>${esc(x.nome)}${x.cidade?" — "+esc(x.cidade):""}${x.tipo==="parceiro"?" (parceiro)":""}</option>`).join("")}</select>
      ${p?`<dl class="kv"><dt>Telefone</dt><dd class="mono">${esc(p.telefone||"—")}</dd><dt>Veículo</dt><dd>${esc(p.veiculo||"—")}</dd></dl>

    <div class="card"><h4>Atendimento</h4>
      <dl class="kv"><dt>Cliente</dt><dd>${esc(cl?cl.nome:"Particular")}</dd><dt>Segurado</dt><dd>${esc(c.segurado||"—")}</dd><dt>Telefone</dt><dd class="mono">${esc(c.telefone||"—")}</dd>
      ${c.placa?`<dt>Veículo</dt><dd>${esc(c.placa)}</dd>`:""}<dt>Origem</dt><dd>${esc(c.origem||"—")}</dd>${c.destino?`<dt>Destino</dt><dd>${esc(c.destino)}</dd>`:""}${c.km?`<dt>Distância</dt><dd class="num">${esc(c.km)} km</dd>`:""}${c.obs?`<dt>Observações</dt><dd>${esc(c.obs)}</dd>`:""}</dl>
      <div class="row">${maps?`<a class="btn sm" href="${esc(maps)}" target="_blank" rel="noopener">${ICON.map}Rota no Maps</a>`:""}${waS?`<a class="btn sm" href="${esc(waS)}" target="_blank" rel="noopener">${ICON.wa}Avisar segurado</a>`:""}<button class="btn sm" data-act="copy" data-kind="seg">${ICON.copy}Copiar aviso</button><button class="btn sm" data-act="edit-chamado" style="margin-left:auto">Editar dados</button></div>

function openChamado(id){ S.openId = id; $("#overlay").innerHTML=""; renderDrawer(); }
function closeOverlay(){ S.openId=null; FORM=null; $("#overlay").innerHTML=""; }
function setPrestador(id, pid){
  return patchChamado(id, n=>{ n.prestadorId = pid||null; const p = pid && byId("prestadores",pid); if(p && !num(n.valorPrestador)){ const v = comissao(n,p) ?? custoParceiro(p,n); if(v) n.valorPrestador = Math.round(v*100)/100; } });
}

/* ---------- Fotos e assinatura ---------- */
async function reduzir(file){
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k = Math.min(1, 900/Math.max(img.naturalWidth,img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
    const b = await new Promise(r=>cv.toBlob(r,"image/jpeg",0.7)); return b || file;
  }catch(_){ return file; }
}
async function uploadFotos(files, tipo){
  if(!ASSETS || !files.length) return; const id = S.openId; const novas = [];

  if(novas.length){ await patchChamado(id, n=>{ n.checklist = n.checklist||{}; n.checklist.fotos = (n.checklist.fotos||[]).concat(novas); }).then(()=>toast(novas.length+" foto"+(novas.length>1?"s":"")+" salva"+(novas.length>1?"s":""))).catch(()=>{}); }

}

      const p = c.prestadorId?byId("prestadores",c.prestadorId):null;
      if(nx==="concluido" && !(c.checklist && c.checklist.fotos && c.checklist.fotos.some(f=>f.tipo==="entrega")) && !t.dataset.forcar){ t.dataset.forcar="1"; t.textContent="Concluir sem fotos da entrega"; toast("Faltam as fotos da entrega. Toque de novo para concluir mesmo assim.","bad"); return; }
      await patchChamado(id, n=>{ n.status=nx; n.eventos=(n.eventos||[]).concat([{status:nx,em:nowISO(),nota:nx==="despachado"&&p?p.nome:""}]); });
      toast(SL[nx].l);
    }
    else if(a==="cancelar"){ await patchChamado(id, n=>{ n.status="cancelado"; n.eventos=(n.eventos||[]).concat([{status:"cancelado",em:nowISO()}]); }); toast("Chamado cancelado"); }
    else if(a==="del-chamado"){ const sid=id; closeOverlay(); await remove("chamados", sid); toast("Chamado excluído"); }
    else if(a==="del-prest"){ const pid=FORM.id; closeOverlay(); await remove("prestadores", pid); toast("Prestador excluído"); }
    else if(a==="del-cli"){ const cid=FORM.id; closeOverlay(); await remove("clientes", cid); toast("Cliente excluído"); }
    else if(a==="copy"){ const c=byId("chamados",id); copyText(t.dataset.kind==="prest"?msgPrestador(c):msgSegurado(c)); }
    else if(a==="copy-fech"){ copyText(fechamento(t.dataset.id), "Fechamento copiado"); }
    else if(a==="backup"){ baixar(`backup-central-jm-${isoData(nowISO())}.json`, JSON.stringify({versao:1, chamados:S.chamados, prestadores:S.prestadores, clientes:S.clientes, config:CFG, fotos:FOTOS}), "application/json"); }
    else if(a==="csv"){ baixarCSV(); }
    else if(a==="copy-convite"){ copyText(CONVITE, "Convite copiado. Cole no WhatsApp do parceiro."); }
  }catch(_){}
});
document.addEventListener("submit", e => { if(e.target.id==="m-form"){ e.preventDefault(); submitForm(); } });
document.addEventListener("input", e => {
  if(e.target.id==="f-q"){ S.q=e.target.value; render(); }
  if(e.target.id==="m-km") sugestao();
  if(e.target.id==="m-vc" || e.target.id==="m-sai"){ delete e.target.dataset.auto; sugestao(); }
});
document.addEventListener("change", e => {
  const el = e.target, id = S.openId;
  if(el.id==="f-fil"){ S.fFil=el.value; render(); }
  else if(el.id==="i-fil"){ S.iFil=el.value; render(); }
  else if(el.id==="cfg-ts" || el.id==="cfg-tk" || el.id==="cfg-tf"){ CFG[{"cfg-ts":"tabSaida","cfg-tk":"tabKm","cfg-tf":"tabFranquia"}[el.id]] = numIn(el.value); saveCfg(); render(); toast("Tabela padrão salva"); }
  else if(el.id==="cfg-imp"){ CFG.imposto = numIn(el.value); persistir(); render(); toast("Imposto salvo"); }
  else if(el.id==="f-mes"){ S.mes = el.value || ymKey(Date.now()); render(); }
  else if(el.id==="m-cli" || el.id==="m-pri") sugestao();
  else if(el.dataset.foto){ const files=[...el.files]; el.value=""; uploadFotos(files, el.dataset.foto); }
  else if(el.dataset.ck){ const k=el.dataset.ck; patchChamado(id, n=>{ n.checklist=n.checklist||{}; n.checklist.itens=Object.assign({}, n.checklist.itens||{}, {[k]:el.checked}); }).catch(()=>{}); }
  else if(el.id==="ck-comb") patchChamado(id, n=>{ n.checklist=n.checklist||{}; n.checklist.combustivel=el.value; }).catch(()=>{});
  else if(el.id==="ck-km") patchChamado(id, n=>{ n.checklist=n.checklist||{}; n.checklist.kmVeiculo=el.value.trim(); }).catch(()=>{});
  else if(el.id==="ck-av") patchChamado(id, n=>{ n.checklist=n.checklist||{}; n.checklist.avarias=el.value; }).catch(()=>{});
  else if(el.id==="d-prest") setPrestador(id, el.value).catch(()=>{});
  else if(el.id==="d-vc") patchChamado(id, n=>{ const antes = clone(n); n.valorCliente = numIn(el.value); ajustarRepasse(antes, n); }).catch(()=>{});
  else if(el.id==="d-vp") patchChamado(id, n=>{ n.valorPrestador = numIn(el.value); }).catch(()=>{});
  else if(el.id==="d-sai") patchChamado(id, n=>{ const antes = clone(n); n.saida = numIn(el.value); ajustarRepasse(antes, n); }).catch(()=>{});
  else if(el.id==="d-rec") patchChamado(id, n=>{ n.recebido = el.checked; }).catch(()=>{});
  else if(el.id==="d-vrec") patchChamado(id, n=>{ n.vencReceber = dataISO(el.value); }).catch(()=>{});
  else if(el.id==="d-vpag") patchChamado(id, n=>{ n.vencPagar = dataISO(el.value); }).catch(()=>{});
  else if(el.id==="arq-backup"){ restaurarBackup(el); }
  else if(el.id==="d-pago") patchChamado(id, n=>{ n.pagoPrestador = el.checked; }).catch(()=>{});
  else if(el.id==="d-fat") patchChamado(id, n=>{ n.faturado = el.checked; }).catch(()=>{});
  else if(el.id==="d-recl") patchChamado(id, n=>{ n.reclamacao = el.checked; }).catch(()=>{});
  else if(el.id==="d-com") patchChamado(id, n=>{ n.avaliacao = Object.assign({}, n.avaliacao||{}, {comentario:el.value}); }).catch(()=>{});
  else if(el.dataset.toggle){ const f=el.dataset.toggle; patchChamado(el.dataset.id, n=>{ n[f]=el.checked; }).then(()=>toast(f==="faturado"?"Marcado como faturado":f==="recebido"?"Marcado como recebido":"Repasse marcado como pago")).catch(()=>{}); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape"){ const lb=$(".lb"); if(lb) lb.remove(); else if($("#overlay").innerHTML) closeOverlay(); } });
setInterval(()=>{ if(!document.querySelector("#overlay .modal") && !(document.activeElement && document.activeElement.id==="f-q")) render(); }, 30000);

/* ---------- Armazenamento neste aparelho ---------- */
const CHAVE = "central24h-jm-v1", CHAVE_ANTIGA = "guinchoja-painel-v1";
function persistir(){
  try{ localStorage.setItem(CHAVE, JSON.stringify({ chamados:S.chamados, prestadores:S.prestadores, clientes:S.clientes, config:CFG })); }
  catch(e){ toast("A memória do navegador encheu. Baixe um backup na aba Financeiro.","bad"); }
}
function aplicarDados(d){
  ["chamados","prestadores","clientes"].forEach(col => { LOCAL[col] = new Map((d[col]||[]).map(x=>[x.id,x])); S[col] = [...LOCAL[col].values()]; });
  CFG = Object.assign({}, CFG_PADRAO, d.config||{});
}
/* Converte o que foi lançado no painel antigo (serviços e parceiros) em chamados concluídos e prestadores */
function migrarAntigo(old){
  const PROP = "proprio";
  const prestadores = (old.parceiros||[]).map(p => ({ id:p.id, nome:p.nome, tipo:"parceiro", credenciamento:"aprovado", cidade:p.cidade||"", telefone:p.zap||"",
    comissaoPct:num(p.pct)||null, saidaFica:"empresa", prazoPag:p.prazo!=null?num(p.prazo):null, ativo:true, docs:{}, criadoEm:nowISO() }));
  const chamados = (old.servicos||[]).map((x, i) => {
    const saida = num(x.saida), kmCob = Math.max(0, num(x.km) - num(x.franquia)), vKm = kmCob*num(x.valorkm), extras = num(x.extras);
    const total = Math.round((saida + vKm + extras)*100)/100, temP = x.parceiro && x.parceiro !== PROP;
    let parc = (vKm + extras + (x.saidafica==="divide" ? saida : 0)) * (temP ? num(x.pct) : 0) / 100 + (temP && x.saidafica==="parceiro" ? saida : 0);
    parc = Math.round(parc*100)/100;
    const em = new Date((x.data || isoData(nowISO())) + "T12:00:00").toISOString();
    return { id:"m"+x.id, protocolo:"CH-"+(x.data||"").replace(/-/g,"").slice(2)+"-"+pad(i+1), status:"concluido", criadoEm:em,
      eventos:[{status:"aberto",em},{status:"concluido",em}], servico:"Reboque / guincho", clienteId:null, segurado:x.cliente||"", placa:x.placa||"",
      origem:x.origem||"", destino:x.destino||"", filial:"Alegrete", prioridade:"normal", km:num(x.km)||null, valorCliente:total, saida,
      prestadorId: temP ? x.parceiro : null, valorPrestador: temP ? parc : 0, pagoPrestador:!!x.pago, recebido:!!x.recebido,
      vencReceber: dataISO(x.vencCli), vencPagar: temP ? dataISO(x.vencParc) : null, obs:x.obs||"", importado:true };
  });
  return { chamados, prestadores, clientes:[], config:{ imposto:num(old.config && old.config.imposto) } };
}
function carregarLocal(){
  let d = null; try{ d = JSON.parse(lsGet(CHAVE)); }catch(_){ d = null; }
  if(!d){
    let old = null; try{ old = JSON.parse(lsGet(CHAVE_ANTIGA)); }catch(_){ old = null; }
    if(old && old.servicos && (old.servicos.length || (old.parceiros||[]).length)){
      d = migrarAntigo(old); aplicarDados(d); persistir();
      if(old.servicos.length) setTimeout(()=>toast(`Trouxe ${old.servicos.length} serviço${old.servicos.length>1?"s":""} do painel antigo.`), 400);
      return;
    }
    d = { chamados:[], prestadores:[], clientes:[] };
  }
  aplicarDados(d);
}
function baixar(nome, conteudo, tipo){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([conteudo], {type:tipo})); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function baixarCSV(){
  const cab = ["Protocolo","Data","Status","Serviço","Cliente","Segurado","Placa","Origem","Destino","KM","Valor cliente","Saída","Prestador","Valor prestador","Parte da JM","Receber até","Recebido","Pagar até","Pago"];
  const f = v => typeof v === "number" ? v.toFixed(2).replace(".", ",") : `"${String(v ?? "").replace(/"/g,'""')}"`;
  const dt = iso => iso ? new Date(iso).toLocaleDateString("pt-BR") : "";
  const linhas = S.chamados.slice().sort((a,b)=>a.criadoEm<b.criadoEm?-1:1).map(c => { const cl = c.clienteId && byId("clientes",c.clienteId), p = c.prestadorId && byId("prestadores",c.prestadorId);
    return [c.protocolo, dt(dataRef(c)), SL[c.status]?SL[c.status].l:c.status, c.servico, cl?cl.nome:"Particular", c.segurado, c.placa, c.origem, c.destino, num(c.km), num(c.valorCliente), num(c.saida), p?p.nome:"", num(c.valorPrestador), num(c.valorCliente)-num(c.valorPrestador), dt(prazoReceber(c)), c.recebido?"sim":"não", dt(prazoPagar(c)), p?(c.pagoPrestador?"sim":"não"):"-"].map(f).join(";"); });
  baixar(`chamados-jm-${isoData(nowISO())}.csv`, "﻿" + [cab.join(";"), ...linhas].join("\n"), "text/csv");
}
function restaurarBackup(input){
  const file = input.files[0]; input.value = ""; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      const novo = d.chamados ? d : (d.servicos ? migrarAntigo(d) : null);
      if(!novo) throw new Error();
      if(!confirm(`Restaurar backup com ${novo.chamados.length} chamado(s)? Os dados atuais deste aparelho serão substituídos.`)) return;
      aplicarDados(novo);
      if(d.fotos){ FOTOS = d.fotos; lsSet(FOTOS_KEY, JSON.stringify(FOTOS)); }
      persistir(); closeOverlay(); render(); toast("Backup restaurado");
    }catch(_){ toast("Arquivo de backup inválido.","bad"); }
  };
  r.readAsText(file);
}

/* ---------- Início ---------- */
MODE = "aparelho"; ASSETS = ASSETS_LOCAL; S.loaded = true;
carregarLocal();
render();
})();

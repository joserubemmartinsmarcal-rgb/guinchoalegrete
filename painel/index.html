<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Controle de Serviços JM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sidebar navy fixa (desktop) / barra inferior (celular); área clara de operação */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#F0F2F6; --fg:#0E1A2B; --muted:#5B6676; --line:#E2E6EC;
  --navy:#0F3460; --gold:#D4A24C; --gold-ink:#8A6420; --bar:#0F3460;
  --primary:#0F3460; --on-primary:#FFFFFF; --side:#0F3460; --side-fg:#DCE5F2; --side-muted:#8EA3C2; --side-active:#1B4A82;
  --ok:#1F8A5B; --ok-bg:#E6F4EC; --warn:#A86A12; --warn-bg:#FBF0DC; --bad:#BE3B34; --bad-bg:#FBE7E5; --info:#2A66A8; --info-bg:#E5EEF8;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 8px 24px rgba(14,26,43,.06);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111E; --surface:#111A2A; --surface-2:#172235; --fg:#E7ECF3; --muted:#93A0B4; --line:#223049;
  --gold-ink:#E2B865; --bar:#D4A24C; --primary:#D4A24C; --on-primary:#1A1405; --side:#0C1628; --side-fg:#DCE5F2; --side-muted:#7F93B3; --side-active:#1A2B48;
  --ok:#4CC08A; --ok-bg:#12301F; --warn:#E3A84A; --warn-bg:#33260F; --bad:#F07A72; --bad-bg:#3A1816; --info:#7FB0EA; --info-bg:#132A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111E; --surface:#111A2A; --surface-2:#172235; --fg:#E7ECF3; --muted:#93A0B4; --line:#223049;
  --gold-ink:#E2B865; --bar:#D4A24C; --primary:#D4A24C; --on-primary:#1A1405; --side:#0C1628; --side-fg:#DCE5F2; --side-muted:#7F93B3; --side-active:#1A2B48;
  --ok:#4CC08A; --ok-bg:#12301F; --warn:#E3A84A; --warn-bg:#33260F; --bad:#F07A72; --bad-bg:#3A1816; --info:#7FB0EA; --info-bg:#132A45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#1A1405;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.brand b{display:block;font-size:15px;color:#fff;letter-spacing:-.01em}
.brand small{color:var(--side-muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--side-fg);font-weight:600;font-size:13.5px}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff}
.nav button[aria-current="page"] svg{stroke:var(--gold);opacity:1}
.nav .count{margin-left:auto;background:var(--gold);color:#1A1405;font-size:11px;font-weight:800;border-radius:20px;padding:1px 7px}
.nav .count.late{background:#F07A72;color:#2A0805}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}

main{padding-block:28px 48px;padding-inline:32px;min-width:0;max-width:1320px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1405}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:1400px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi .v{font-size:clamp(18px,1.55vw,24px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hi{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.kpi.hi .l,.kpi.hi .s{color:inherit;opacity:.8}
.kpi.alert{border-color:var(--warn);background:var(--warn-bg)}
.kpi.alert .v{color:var(--warn)}
.kpi.bad{border-color:var(--bad);background:var(--bad-bg)}
.kpi.bad .v{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.panel-h .sub{color:var(--muted);font-size:12.5px}
.panel-b{padding:14px 18px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tbody tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
td .t1{font-weight:700}
td .t2{color:var(--muted);font-size:12.5px}
.r{text-align:right}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutro{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:6px;padding:1px 6px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:64px}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.input:disabled{opacity:.5}
.toolbar .input{width:auto}

.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;margin-bottom:5px}
.bar .track{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--bar);border-radius:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--gold-ink);flex:none}
.li .grow{flex:1 1 150px;min-width:0}
.li .grow b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{color:var(--muted);font-size:12px}
.li .val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.show-sm{display:none}

/* Modal */
dialog.modal{border:1px solid var(--line);padding:0;width:min(720px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);color:var(--fg);border-radius:16px;box-shadow:var(--shadow)}
dialog.modal[open]{display:flex;flex-direction:column}
dialog.modal::backdrop{background:rgba(8,14,26,.45)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{margin:0;font-size:17px;font-weight:800}
.modal-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal-f .esq{margin-right:auto}
.sec-t{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:700;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding-top:20px}
.check input{width:17px;height:17px;accent-color:var(--navy);flex:none}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.money div{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.money span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.money b{font-size:17px;font-variant-numeric:tabular-nums}
.money .me b{color:var(--gold-ink)}
.conta{font-size:12px;color:var(--muted)}
.banner{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;margin-bottom:16px}
.banner.info{background:var(--info-bg);color:var(--info)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;gap:0}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;font-size:10px;padding:6px 2px;flex:1;justify-content:center;text-align:center;position:relative;min-width:0}
  .nav .count{position:absolute;top:0;right:18%;margin:0;font-size:10px;padding:0 5px}
  main{padding-inline:16px;padding-block:18px 96px}
  .head h1{font-size:22px}
  .fgrid{grid-template-columns:1fr 1fr}
  .hide-sm{display:none}
  .show-sm{display:block}
  .acts{flex-direction:column;align-items:flex-end}
  td,th{padding:10px 8px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:19px}
  .kpi{padding:14px}
  .check{padding-top:0}
}
@media (max-width:420px){.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">JM</div><div><b>Controle de Serviços</b><small>Comissões e prazos</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span><span class="dot"></span>Salvo neste aparelho</span><span>Alegrete · São Gabriel · Bagé</span></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>

<!-- ══ MODAL SERVIÇO ══ -->
<dialog class="modal" id="dlg-servico">
  <div class="modal-h"><h3 id="dlg-servico-titulo">Novo serviço</h3><button class="btn sm" type="button" data-fechar="dlg-servico">Fechar</button></div>
  <div class="modal-b" id="form-servico">
    <input type="hidden" id="s-id"/>
    <p class="sec-t">Atendimento</p>
    <div class="fgrid">
      <div class="f"><label for="s-data">Data</label><input class="input" id="s-data" type="date"/></div>
      <div class="f"><label for="s-cliente">Cliente</label><input class="input" id="s-cliente" placeholder="Seguradora, particular…"/></div>
      <div class="f"><label for="s-parceiro">Quem executou</label><select class="input" id="s-parceiro"></select></div>
      <div class="f"><label for="s-origem">Origem</label><input class="input" id="s-origem" placeholder="Alegrete"/></div>
      <div class="f"><label for="s-destino">Destino</label><input class="input" id="s-destino" placeholder="Santiago"/></div>
      <div class="f"><label for="s-placa">Veículo / placa</label><input class="input" id="s-placa"/></div>
    </div>
    <p class="sec-t">Valores e divisão</p>
    <div class="fgrid">
      <div class="f"><label for="s-saida">Saída (R$)</label><input class="input" id="s-saida" type="number" step="0.01" min="0" inputmode="decimal"/></div>
      <div class="f"><label for="s-km">KM total</label><input class="input" id="s-km" type="number" step="0.1" min="0" inputmode="decimal"/></div>
      <div class="f"><label for="s-franquia">KM incluso na saída</label><input class="input" id="s-franquia" type="number" step="0.1" min="0" value="0" inputmode="decimal"/></div>
      <div class="f"><label for="s-valorkm">R$ por KM excedente</label><input class="input" id="s-valorkm" type="number" step="0.01" min="0" inputmode="decimal"/></div>
      <div class="f"><label for="s-extras">Extras (pedágio, patins…)</label><input class="input" id="s-extras" type="number" step="0.01" min="0" value="0" inputmode="decimal"/></div>
      <div class="f"><label for="s-saidafica">A saída fica com</label>
        <select class="input" id="s-saidafica">
          <option value="empresa">Comigo (empresa)</option>
          <option value="divide">Entra na divisão (%)</option>
          <option value="parceiro">Com o parceiro</option>
        </select></div>
      <div class="f"><label for="s-pct">% do parceiro</label><input class="input" id="s-pct" type="number" step="0.01" min="0" max="100" inputmode="decimal"/><span class="hint">Sobre KM + extras</span></div>
    </div>
    <div class="money" id="s-previa"></div>
    <p class="sec-t">Prazos</p>
    <div class="fgrid">
      <div class="f"><label for="s-venc-cli">Receber do cliente até</label><input class="input" id="s-venc-cli" type="date"/></div>
      <label class="check"><input type="checkbox" id="s-recebido"/> Já recebi do cliente</label>
      <div></div>
      <div class="f"><label for="s-venc-parc">Pagar o parceiro até</label><input class="input" id="s-venc-parc" type="date"/></div>
      <label class="check"><input type="checkbox" id="s-pago"/> Já paguei o parceiro</label>
      <div></div>
      <div class="f full"><label for="s-obs">Observações</label><textarea class="input" id="s-obs" rows="2"></textarea></div>
    </div>
  </div>
  <div class="modal-f">
    <button class="btn danger esq" type="button" id="s-excluir">Excluir</button>
    <button class="btn" type="button" data-fechar="dlg-servico">Cancelar</button>
    <button class="btn primary" type="button" id="s-salvar">Salvar serviço</button>
  </div>
</dialog>

<!-- ══ MODAL PARCEIRO ══ -->
<dialog class="modal" id="dlg-parceiro">
  <div class="modal-h"><h3>Parceiro</h3><button class="btn sm" type="button" data-fechar="dlg-parceiro">Fechar</button></div>
  <div class="modal-b">
    <input type="hidden" id="p-id"/>
    <div class="fgrid">
      <div class="f"><label for="p-nome">Nome</label><input class="input" id="p-nome"/></div>
      <div class="f"><label for="p-cidade">Cidade</label><input class="input" id="p-cidade"/></div>
      <div class="f"><label for="p-zap">WhatsApp (com DDD)</label><input class="input" id="p-zap" placeholder="55999999999" inputmode="tel"/></div>
      <div class="f"><label for="p-pct">% padrão dele</label><input class="input" id="p-pct" type="number" step="0.01" min="0" max="100"/></div>
      <div class="f"><label for="p-prazo">Pagar em quantos dias</label><input class="input" id="p-prazo" type="number" min="0" step="1"/><span class="hint">Contados da data do serviço</span></div>
    </div>
  </div>
  <div class="modal-f">
    <button class="btn danger esq" type="button" id="p-excluir">Excluir</button>
    <button class="btn" type="button" data-fechar="dlg-parceiro">Cancelar</button>
    <button class="btn primary" type="button" id="p-salvar">Salvar parceiro</button>
  </div>
</dialog>

<input type="file" id="arq-backup" accept="application/json,.json" hidden/>

<script>
(function(){
"use strict";
/* ══ DADOS ══ */
const CHAVE = 'guinchoja-painel-v1';
const PROPRIO = 'proprio';   // id usado quando o serviço é da frota própria

function novoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function carregar(){
  try { const d = JSON.parse(localStorage.getItem(CHAVE)); if (d && d.servicos && d.parceiros) return d; } catch (e) {}
  return { config:{ imposto:0, pct:60 }, parceiros:[{ id:novoId(), nome:'Maurício', cidade:'Alegrete', zap:'', pct:60, prazo:7 }], servicos:[] };
}
function gravar(){
  try { localStorage.setItem(CHAVE, JSON.stringify(db)); }
  catch (e) { toast('Não consegui salvar neste navegador. Baixe um backup.', 'bad'); }
}
let db = carregar();
const S = { view:'painel', mes:'', sMes:'', sParc:'*', sStatus:'todos' };

/* ══ UTIL ══ */
const $ = id => document.getElementById(id);
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const isoLocal = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const hojeISO = () => isoLocal(new Date());
function somaDias(iso, dias){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + dias); return isoLocal(d); }
const dataBR = iso => iso ? iso.split('-').reverse().join('/') : '—';
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesBR = ym => { const [a, m] = ym.split('-'); return MESES[+m - 1] + '/' + a; };
const initials = s => String(s || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const parceiroNome = id => id === PROPRIO ? 'Frota própria' : (db.parceiros.find(p => p.id === id)?.nome || 'Parceiro removido');
const rotaTxt = s => [s.origem, s.destino].filter(Boolean).join(' → ') || 'sem rota';
const noMes = (s, ym) => !ym || (s.data || '').startsWith(ym);
function toast(msg, kind){ const t = $('toast'); t.textContent = msg; t.className = 'toast' + (kind === 'bad' ? ' bad' : ''); t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3000); }

};

/* ══ CÁLCULO DA DIVISÃO ══ */
function calcular(s){
  const saida = num(s.saida);
  const kmCobrado = Math.max(0, num(s.km) - num(s.franquia));
  const valorKm = kmCobrado * num(s.valorkm);
  const extras = num(s.extras);
  const total = saida + valorKm + extras;
  const temParc = s.parceiro !== PROPRIO;
  const pct = temParc ? num(s.pct) : 0;
  const base = valorKm + extras + (s.saidafica === 'divide' ? saida : 0);
  let parceiro = base * pct / 100;
  if (temParc && s.saidafica === 'parceiro') parceiro += saida;
  parceiro = Math.round(parceiro * 100) / 100;
  const empresa = Math.round((total - parceiro) * 100) / 100;
  const imposto = Math.round(total * num(db.config.imposto) / 100 * 100) / 100;
  return { saida, kmCobrado, valorKm, extras, total, base, pct, parceiro, empresa, imposto, liquido:empresa - imposto, temParc };
}

/* ══ PRAZOS ══ */
function diasAte(venc){ return Math.round((new Date(venc + 'T12:00:00') - new Date(hojeISO() + 'T12:00:00')) / 86400000); }
function prazoPill(venc, quitado, rotOk){
  if (quitado) return `<span class="pill ok">${rotOk}</span>`;
  if (!venc) return `<span class="pill neutro">Sem prazo</span>`;
  const d = diasAte(venc);
  if (d < 0) return `<span class="pill bad">Vencido há ${-d}d</span>`;
  if (d === 0) return `<span class="pill warn">Vence hoje</span>`;
  if (d <= 3) return `<span class="pill warn">Em ${d}d</span>`;
  return `<span class="pill neutro">${dataBR(venc)}</span>`;
}
const vencido = (venc, quitado) => !quitado && venc && venc < hojeISO();
const atrasado = s => vencido(s.vencCli, s.recebido) || (s.parceiro !== PROPRIO && vencido(s.vencParc, s.pago));

function mesesDisponiveis(){
  const set = new Set(db.servicos.map(s => (s.data || '').slice(0, 7)).filter(Boolean));
  set.add(hojeISO().slice(0, 7));
  return [...set].sort().reverse();
}
const opcoesMes = sel => `<option value="">Todos os meses</option>` + mesesDisponiveis().map(m => `<option value="${m}" ${sel === m ? 'selected' : ''}>${mesBR(m)}</option>`).join('');

function render(){

function renderNav(){

}
const head = (t, p, actions) => `<div class="head"><div><h1>${t}</h1>${p ? `<p>${p}</p>` : ''}</div><div class="row">${actions || ''}</div></div>`;

function vPainel(){
  const ym = S.mes;
  const lista = db.servicos.filter(s => noMes(s, ym));
  let tot = 0, emp = 0, liq = 0, parc = 0;
  lista.forEach(s => { const c = calcular(s); tot += c.total; emp += c.empresa; liq += c.liquido; parc += c.parceiro; });

  // pendências consideram todos os meses: dinheiro atrasado não some ao trocar o filtro
  let aReceber = 0, aPagar = 0, venc = 0;
  db.servicos.forEach(s => {
    const c = calcular(s);
    if (!s.recebido) { aReceber += c.total; if (vencido(s.vencCli, false)) venc++; }
    if (c.temParc && !s.pago) { aPagar += c.parceiro; if (vencido(s.vencParc, false)) venc++; }
  });
  const imp = num(db.config.imposto);
  const d = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });

  const ordena = (a, b) => (a.v || '9999') < (b.v || '9999') ? -1 : 1;
  const rec = db.servicos.filter(s => !s.recebido).map(s => ({ s, v:s.vencCli })).sort(ordena);
  const pag = db.servicos.filter(s => s.parceiro !== PROPRIO && !s.pago).map(s => ({ s, v:s.vencParc })).sort(ordena);

  const porParc = {};
  lista.forEach(s => {
    if (s.parceiro === PROPRIO) return;
    const c = calcular(s);
    porParc[s.parceiro] ??= { total:0, pend:0, qtd:0 };
    porParc[s.parceiro].total += c.parceiro; porParc[s.parceiro].qtd++;
    if (!s.pago) porParc[s.parceiro].pend += c.parceiro;
  });
  const linhas = Object.entries(porParc).sort((a, b) => b[1].total - a[1].total);
  const max = Math.max(1, ...linhas.map(([, v]) => v.total));

  return head('Painel financeiro', d.charAt(0).toUpperCase() + d.slice(1),
      `<select class="input" id="f-mes" style="width:auto">${opcoesMes(ym)}</select>${btnNovo}`)
  + (venc ? `<div class="banner">${venc} prazo${venc > 1 ? 's' : ''} vencido${venc > 1 ? 's' : ''}. Cobre o cliente ou acerte o repasse hoje.</div>` : '')
  + `<div class="kpis">
    <div class="kpi"><span class="l">Faturado ${ym ? mesBR(ym) : '(tudo)'}</span><span class="v">${brl(tot)}</span><span class="s">${lista.length} serviço(s)</span></div>
    <div class="kpi hi"><span class="l">Minha parte${imp ? ' líquida' : ''}</span><span class="v">${brl(imp ? liq : emp)}</span><span class="s">${imp ? 'Bruto ' + brl(emp) + ' − imposto ' + imp + '%' : 'Antes de imposto'}</span></div>
    <div class="kpi"><span class="l">Repasse parceiros</span><span class="v">${brl(parc)}</span><span class="s">No período</span></div>
    <div class="kpi ${aReceber ? 'alert' : ''}"><span class="l">Falta receber</span><span class="v">${brl(aReceber)}</span><span class="s">${rec.length} de clientes</span></div>
    <div class="kpi ${aPagar ? 'alert' : ''}"><span class="l">Falta pagar</span><span class="v">${brl(aPagar)}</span><span class="s">${pag.length} a parceiros</span></div>
    <div class="kpi ${venc ? 'bad' : ''}"><span class="l">Prazos vencidos</span><span class="v">${venc}</span><span class="s">${venc ? 'Resolver hoje' : 'Tudo em dia'}</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>A receber dos clientes</h2><span class="sub">Por prazo</span></div>
      <div class="panel-b">${rec.length ? `<div class="list">${rec.map(({ s }) => `
        <div class="li"><div class="grow"><b>${esc(s.cliente || 'Cliente')}</b><span>${esc(rotaTxt(s))} · ${dataBR(s.data)}</span></div>
          ${prazoPill(s.vencCli, false)}<span class="val">${brl(calcular(s).total)}</span>
          <button class="btn sm" data-marcar="recebido" data-id="${s.id}">Recebi</button></div>`).join('')}</div>`
        : '<div class="muted">Nada pendente para receber.</div>'}</div>
    </section>
    <section class="panel"><div class="panel-h"><h2>A pagar aos parceiros</h2><span class="sub">Por prazo</span></div>
      <div class="panel-b">${pag.length ? `<div class="list">${pag.map(({ s }) => `
        <div class="li"><div class="av">${esc(initials(parceiroNome(s.parceiro)))}</div><div class="grow"><b>${esc(parceiroNome(s.parceiro))}</b><span>${esc(rotaTxt(s))} · ${dataBR(s.data)}</span></div>
          ${prazoPill(s.vencParc, false)}<span class="val">${brl(calcular(s).parceiro)}</span>
          <button class="btn sm" data-marcar="pago" data-id="${s.id}">Paguei</button></div>`).join('')}</div>`
        : '<div class="muted">Nenhum repasse pendente.</div>'}</div>
    </section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Repasse por parceiro</h2><span class="sub">${ym ? mesBR(ym) : 'Todos os meses'}</span></div>
    <div class="panel-b bars">${linhas.length ? linhas.map(([id, v]) => `
      <div class="bar" title="${esc(parceiroNome(id))}: ${brl(v.total)} em ${v.qtd} serviço(s)">
        <div class="lbl"><span>${esc(parceiroNome(id))} <span class="muted">· ${v.qtd} serviço(s)</span></span>
          <span class="num">${brl(v.total)} ${v.pend ? `<span style="color:var(--warn)">· falta ${brl(v.pend)}</span>` : '<span style="color:var(--ok)">· quitado</span>'}</span></div>
        <div class="track"><div class="fill" style="width:${(v.total / max * 100).toFixed(1)}%"></div></div>
      </div>`).join('') : '<div class="muted">Nenhum serviço de parceiro neste período.</div>'}</div>
  </section>`;
}

function vServicos(){
  const lista = db.servicos
    .filter(s => noMes(s, S.sMes))
    .filter(s => S.sParc === '*' || s.parceiro === S.sParc)
    .filter(s => {
      const temParc = s.parceiro !== PROPRIO;
      if (S.sStatus === 'receber') return !s.recebido;
      if (S.sStatus === 'pagar') return temParc && !s.pago;
      if (S.sStatus === 'vencidos') return atrasado(s);
      if (S.sStatus === 'ok') return s.recebido && (!temParc || s.pago);
      return true;
    })
    .sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const segs = [['todos','Todos'],['receber','A receber'],['pagar','A pagar'],['vencidos','Vencidos'],['ok','Quitados']];
  const parcOpts = `<option value="*">Todos os parceiros</option>` + db.parceiros.map(p => `<option value="${p.id}" ${S.sParc === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('') + `<option value="${PROPRIO}" ${S.sParc === PROPRIO ? 'selected' : ''}>Frota própria</option>`;

      <td><div class="t1">${esc(rotaTxt(s))}</div><div class="t2">${dataBR(s.data)} · ${esc(s.cliente || 'sem cliente')}${s.placa ? ' · ' + esc(s.placa) : ''}</div><div class="t2 show-sm">Total ${brl(c.total)} · ${esc(parceiroNome(s.parceiro))}</div></td>
      <td class="hide-sm"><div class="t1">${esc(parceiroNome(s.parceiro))}</div><div class="t2">${c.temParc ? c.pct + '% · saída ' + { empresa:'comigo', divide:'dividida', parceiro:'dele' }[s.saidafica] : 'Sem repasse'}</div></td>
      <td class="r num hide-sm"><div class="t1">${brl(c.total)}</div><div class="t2">${c.kmCobrado.toLocaleString('pt-BR')} km</div></td>
      <td class="r num hide-sm">${c.temParc ? brl(c.parceiro) : '—'}</td>
      <td class="r num"><div class="t1" style="color:var(--gold-ink)">${brl(c.empresa)}</div>${c.imposto ? `<div class="t2">líq. ${brl(c.liquido)}</div>` : ''}</td>
      <td>${prazoPill(s.vencCli, s.recebido, 'Recebido')}</td>
      <td class="hide-sm">${c.temParc ? prazoPill(s.vencParc, s.pago, 'Pago') : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>`
    : emptyBox('Nenhum serviço encontrado', db.servicos.length ? 'Ajuste os filtros.' : 'Lance a primeira remoção para começar.', db.servicos.length ? '' : btnNovo)}</section>`;

    return { p, qtd:servs.length, total:servs.reduce((a, s) => a + calcular(s).parceiro, 0), pend:pend.reduce((a, s) => a + calcular(s).parceiro, 0), nPend:pend.length, venc:pend.some(s => vencido(s.vencParc, false)) };

  return head('Parceiros', `${db.parceiros.length} cadastrados`, `<button class="btn primary" data-act="novo-parceiro">${ICON.plus}Novo parceiro</button>`) + `

/* ══ SERVIÇO: FORM ══ */
const CAMPOS = ['data','cliente','parceiro','origem','destino','placa','saida','km','franquia','valorkm','extras','saidafica','pct','obs'];
function opcoesParceiro(sel){
  sel.innerHTML = db.parceiros.map(p => `<option value="${p.id}">${esc(p.nome)}${p.cidade ? ' (' + esc(p.cidade) + ')' : ''}</option>`).join('') + `<option value="${PROPRIO}">Frota própria</option>`;
}
function abrirServico(id){
  opcoesParceiro($('s-parceiro'));
  const s = db.servicos.find(x => x.id === id);
  $('dlg-servico-titulo').textContent = s ? 'Editar serviço' : 'Novo serviço';
  $('s-excluir').hidden = !s;
  $('s-id').value = s ? s.id : '';
  if (s) {
    CAMPOS.forEach(k => $('s-' + k).value = s[k] ?? '');
    $('s-venc-cli').value = s.vencCli || '';
    $('s-venc-parc').value = s.vencParc || '';
    $('s-recebido').checked = !!s.recebido;
    $('s-pago').checked = !!s.pago;
  } else {
    CAMPOS.forEach(k => $('s-' + k).value = '');
    const p = db.parceiros[0];
    $('s-data').value = hojeISO();
    $('s-parceiro').value = p ? p.id : PROPRIO;
    $('s-franquia').value = 0;
    $('s-extras').value = 0;
    $('s-saidafica').value = 'empresa';
    aplicarPadraoParceiro();
    $('s-venc-cli').value = '';
    $('s-recebido').checked = false;
    $('s-pago').checked = false;
  }
  atualizarPrevia();
  $('dlg-servico').showModal();
}
function aplicarPadraoParceiro(){
  const p = db.parceiros.find(x => x.id === $('s-parceiro').value);
  $('s-pct').value = p ? num(p.pct) : 0;
  $('s-venc-parc').value = p && $('s-data').value ? somaDias($('s-data').value, num(p.prazo)) : '';
}
function lerForm(){
  const s = {};
  CAMPOS.forEach(k => s[k] = $('s-' + k).value);
  s.vencCli = $('s-venc-cli').value; s.vencParc = $('s-venc-parc').value;
  s.recebido = $('s-recebido').checked; s.pago = $('s-pago').checked;
  return s;
}
function atualizarPrevia(){
  const s = lerForm(), c = calcular(s);
  $('s-pct').disabled = !c.temParc;
  $('s-venc-parc').disabled = $('s-pago').disabled = !c.temParc;
  $('s-previa').innerHTML = `
    <div><span>Total do serviço</span><b>${brl(c.total)}</b></div>
    ${c.temParc ? `<div><span>${esc(parceiroNome(s.parceiro))} (${c.pct}%)</span><b>${brl(c.parceiro)}</b></div>` : ''}
    <div class="me"><span>Minha parte</span><b>${brl(c.empresa)}</b></div>
    ${c.imposto ? `<div><span>Imposto ${num(db.config.imposto)}%</span><b>− ${brl(c.imposto)}</b></div><div class="me"><span>Minha líquida</span><b>${brl(c.liquido)}</b></div>` : ''}
    <div class="conta" style="grid-column:1/-1;background:none;padding:0">Saída ${brl(c.saida)} + ${c.kmCobrado.toLocaleString('pt-BR')} km × ${brl(s.valorkm)} = ${brl(c.valorKm)}${c.extras ? ' + extras ' + brl(c.extras) : ''}.
    ${c.temParc ? `Parceiro: ${c.pct}% de ${brl(c.base)}${s.saidafica === 'parceiro' ? ' + saída' : ''}.` : ''}</div>`;
}
function salvarServico(){
  const s = lerForm();
  if (!s.data) return toast('Informe a data do serviço.', 'bad');
  if (calcular(s).total <= 0) return toast('Informe o valor da saída e/ou os KM.', 'bad');
  const id = $('s-id').value;
  if (id) { const i = db.servicos.findIndex(x => x.id === id); db.servicos[i] = { ...db.servicos[i], ...s }; }
  else db.servicos.push({ id:novoId(), ...s });
  gravar(); $('dlg-servico').close(); render(); toast('Serviço salvo.');
}
function excluirServico(){
  if (!confirm('Excluir este serviço? Não dá para desfazer.')) return;
  db.servicos = db.servicos.filter(x => x.id !== $('s-id').value);
  gravar(); $('dlg-servico').close(); render(); toast('Serviço excluído.');
}
function marcar(id, campo){
  const s = db.servicos.find(x => x.id === id); if (!s) return;
  s[campo] = true; gravar(); render();
  toast(campo === 'recebido' ? 'Marcado como recebido.' : 'Repasse marcado como pago.');
}

/* ══ PARCEIRO: FORM ══ */
function abrirParceiro(id){
  const p = db.parceiros.find(x => x.id === id);
  $('p-excluir').hidden = !p;
  $('p-id').value = p ? p.id : '';
  $('p-nome').value = p?.nome || '';
  $('p-cidade').value = p?.cidade || '';
  $('p-zap').value = p?.zap || '';
  $('p-pct').value = p ? num(p.pct) : num(db.config.pct);
  $('p-prazo').value = p ? num(p.prazo) : 7;
  $('dlg-parceiro').showModal();
}
function salvarParceiro(){
  const dados = { nome:$('p-nome').value.trim(), cidade:$('p-cidade').value.trim(), zap:$('p-zap').value.trim(), pct:num($('p-pct').value), prazo:num($('p-prazo').value) };
  if (!dados.nome) return toast('Informe o nome do parceiro.', 'bad');
  const id = $('p-id').value;
  if (id) Object.assign(db.parceiros.find(x => x.id === id), dados);
  else db.parceiros.push({ id:novoId(), ...dados });
  gravar(); $('dlg-parceiro').close(); render(); toast('Parceiro salvo.');
}
function excluirParceiro(){
  const id = $('p-id').value;
  if (db.servicos.some(s => s.parceiro === id)) return toast('Esse parceiro tem serviços lançados.', 'bad');
  if (!confirm('Excluir este parceiro?')) return;
  db.parceiros = db.parceiros.filter(x => x.id !== id);
  gravar(); $('dlg-parceiro').close(); render();
}
function zapFechamento(pid){
  const p = db.parceiros.find(x => x.id === pid);
  const pend = db.servicos.filter(s => s.parceiro === pid && !s.pago).sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  let total = 0;
  const linhas = pend.map(s => { const c = calcular(s); total += c.parceiro; return `• ${dataBR(s.data)} ${rotaTxt(s)} (${c.kmCobrado} km) — total ${brl(c.total)} → sua parte ${brl(c.parceiro)}`; });
  const msg = `Fala ${p.nome}! Fechamento dos serviços:\n\n${linhas.join('\n')}\n\n*Total a receber: ${brl(total)}*\n\nValeu pela parceria! 🚛`;
  const fone = String(p.zap || '').replace(/\D/g, '');
  window.open(`https://wa.me/${fone ? (fone.startsWith('55') ? fone : '55' + fone) : ''}?text=${encodeURIComponent(msg)}`, '_blank');
}

/* ══ BACKUP ══ */
function baixar(nome, conteudo, tipo){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type:tipo }));
  a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function baixarCSV(){
  const cab = ['Data','Cliente','Executou','Origem','Destino','Placa','Saída','KM','KM incluso','R$/KM','Extras','Total','% parceiro','Parceiro recebe','Minha parte','Imposto','Minha parte líquida','Prazo cliente','Recebido','Prazo parceiro','Pago','Obs'];
  const f = v => typeof v === 'number' ? v.toFixed(2).replace('.', ',') : `"${String(v ?? '').replace(/"/g, '""')}"`;
  const linhas = db.servicos.map(s => { const c = calcular(s);
    return [dataBR(s.data), s.cliente, parceiroNome(s.parceiro), s.origem, s.destino, s.placa, c.saida, num(s.km), num(s.franquia), num(s.valorkm), c.extras, c.total, c.pct, c.parceiro, c.empresa, c.imposto, c.liquido, dataBR(s.vencCli), s.recebido ? 'sim' : 'não', dataBR(s.vencParc), c.temParc ? (s.pago ? 'sim' : 'não') : '-', s.obs].map(f).join(';'); });
  baixar(`servicos-jm-${hojeISO()}.csv`, '﻿' + [cab.join(';'), ...linhas].join('\n'), 'text/csv');
}
$('arq-backup').addEventListener('change', e => {
  const input = e.target, f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.servicos || !d.parceiros) throw new Error();
      if (confirm(`Restaurar backup com ${d.servicos.length} serviço(s)? Os dados atuais deste aparelho serão substituídos.`)) {
        db = { config:{ imposto:0, pct:60, ...d.config }, parceiros:d.parceiros, servicos:d.servicos };
        gravar(); render(); toast('Backup restaurado.');
      }
    } catch (err) { toast('Arquivo de backup inválido.', 'bad'); }
    input.value = '';
  };
  r.readAsText(f);
});

/* ══ EVENTOS ══ */
document.addEventListener('click', e => {
  const t = e.target.closest('button, tr[data-open]'); if (!t) return;
  const d = t.dataset;
  if (d.nav) { S.view = d.nav; render(); window.scrollTo(0, 0); return; }
  if (d.fechar) { $(d.fechar).close(); return; }
  if (d.open) return abrirServico(d.open);
  if (d.marcar) return marcar(d.id, d.marcar);
  if (d.fstatus) { S.sStatus = d.fstatus; render(); return; }
  if (d.zap) return zapFechamento(d.zap);
  if (d.editParc) return abrirParceiro(d.editParc);
  switch (d.act) {
    case 'novo-servico': return abrirServico();
    case 'novo-parceiro': return abrirParceiro();
    case 'salvar-config':
      db.config.imposto = num($('cfg-imposto').value); db.config.pct = num($('cfg-pct').value);
      gravar(); render(); return toast('Configurações salvas.');
    case 'backup': return baixar(`backup-servicos-jm-${hojeISO()}.json`, JSON.stringify(db, null, 2), 'application/json');
    case 'restaurar': return $('arq-backup').click();
    case 'csv': return baixarCSV();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-mes') { S.mes = e.target.value; render(); }
  if (e.target.id === 'f-smes') { S.sMes = e.target.value; render(); }
  if (e.target.id === 'f-sparc') { S.sParc = e.target.value; render(); }
});
$('s-salvar').addEventListener('click', salvarServico);
$('s-excluir').addEventListener('click', excluirServico);
$('p-salvar').addEventListener('click', salvarParceiro);
$('p-excluir').addEventListener('click', excluirParceiro);
$('form-servico').addEventListener('input', atualizarPrevia);
$('s-parceiro').addEventListener('change', () => { aplicarPadraoParceiro(); atualizarPrevia(); });
$('s-data').addEventListener('change', () => {
  const p = db.parceiros.find(x => x.id === $('s-parceiro').value);
  if (p && !$('s-id').value) $('s-venc-parc').value = somaDias($('s-data').value, num(p.prazo));
});

S.mes = S.sMes = hojeISO().slice(0, 7);
render();
})();
</script>
</body>

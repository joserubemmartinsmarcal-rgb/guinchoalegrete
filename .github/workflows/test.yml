name: Testes Automatizados - Rotina de Controle Diario
on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar testes com Node Test Runner
        run: node --test tests/daily-control.test.js

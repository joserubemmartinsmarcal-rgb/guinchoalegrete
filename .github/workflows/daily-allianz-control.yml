name: Abertura Diaria - Controle Operacao Allianz
on:
  schedule:
    # 07:00 Horário de Brasília (UTC-3) -> 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      responsavel:
        description: 'Responsável pelo plantão (usuário GitHub)'
        required: false
        default: 'joserubemmartinsmarcal-rgb'

concurrency:
  group: daily-allianz-control
  cancel-in-progress: false

jobs:
  create_daily_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Obter data atual
        id: date
        run: echo "today=$(date +'%d/%m/%Y')" >> $GITHUB_OUTPUT

      - name: Criar Issue de Controle Diario
        uses: actions/github-script@v7
        with:
          script: |
            const today = '${{ steps.date.outputs.today }}';
            const expectedTitle = `Controle Diário - Allianz [${today}]`;
            const requiredLabels = ['operacao-urgente', 'financeiro-km', 'allianz-sla'];
            const assignee = context.payload.inputs?.responsavel || context.repo.owner;

            // 1. Validação de labels existentes no repositório
            const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existingLabelNames = new Set(repoLabels.map(l => l.name));
            const missingLabels = requiredLabels.filter(name => !existingLabelNames.has(name));

            if (missingLabels.length > 0) {
              core.setFailed(`Erro de validação: As seguintes labels não existem no repositório: ${missingLabels.join(', ')}. Crie as labels antes de executar.`);
              return;
            }

            // 2. Verificação de issue já existente para a mesma data (evita duplicidades)
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            const existingIssue = issues.find(issue => issue.title && issue.title.trim() === expectedTitle.trim());
            if (existingIssue) {
              core.notice(`A issue para a data ${today} já existe: #${existingIssue.number} (${existingIssue.html_url}). Nenhuma nova issue criada.`);
              return;
            }

            // 3. Montagem do corpo e criação da issue
            const body = `### 📋 Dados do Plantão
            - **Data:** ${today}
            - **Responsável pelo Plantão:** @${assignee}
            - **Guincho(s) e Motorista(s) Escalados:** 

            ---

            ### 🚨 Registro de Chamados do Dia
            - **Número da OS / Acionamento Allianz:** 
            - **Nome do Segurado:** 
            - **Veículo / Placa:** 
            - **Origem / Destino:** 

            ### ⏱️ Horários do SLA
            - **Acionamento:** 
            - **Saída Base:** 
            - **Previsão Informada:** 
            - **Chegada Local:** 
            - **Conclusão/Entrega:** 

            ### 🛣️ Quilometragem (KM)
            - **KM Saída / Chegada / Destino / Retorno:** 
            - **KM Total:** 
            - **KM Autorizada Allianz:** 
            - **KM Excedente:** 

            ### 💳 Pedágios e Despesas
            - **Total Pedágios (R$):** 
            - **Comprovantes:** (anexar fotos/recibos)

            ### 📷 Vistoria e Fotos
            - [ ] Fotos do veículo (frente, traseira, placa)
            - [ ] Veículo embarcado
            - [ ] Local de entrega
            - [ ] Comprovante assinado

            ---
            ### 💵 Fechamento Financeiro
            - [ ] Lançado no sistema
            - [ ] Pronto para faturamento`;

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: expectedTitle,
              body: body,
              assignees: [assignee],
              labels: requiredLabels
            });

            core.info(`Issue criada com sucesso: #${created.data.number}`);

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#171C23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JM Serviços | JM Transportes</title>
<link rel="icon" href="https://jmautossocorro.vercel.app/assets/logo-jm.png">
<link rel="apple-touch-icon" href="https://jmautossocorro.vercel.app/assets/logo-jm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Cores do site jmautossocorro.vercel.app: grafite #171C23, aço #344B63, prata #C0C8D0 */
:root{
  --bg:#171C23;--card:#1F252E;--card2:#262D37;--line:#2E3845;--line2:#344B63;--fg:#FFFFFF;--muted:#AEB8C3;--dim:#7F8A97;
  --acc:#C0C8D0;--acc-grad:linear-gradient(130deg,#C0C8D0,#5D7591);--on-acc:#171C23;--acc-ink:#C0C8D0;--acc-soft:#2A3646;
  --ok:#4CC08A;--ok-bg:rgba(76,192,138,.13);--warn:#E3A84A;--warn-bg:rgba(227,168,74,.13);--bad:#F07A72;--bad-bg:rgba(240,122,114,.13);
  --info:#8FB8E8;--info-bg:rgba(143,184,232,.13);--vio:#B9A5F0;--vio-bg:rgba(185,165,240,.13);
  --top:rgba(23,28,35,.94);--shadow:0 10px 40px rgba(0,0,0,.45);color-scheme:dark;
  --f:'Inter',Arial,Helvetica,sans-serif;--fh:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{
  --bg:#F2F4F7;--card:#FFFFFF;--card2:#F6F8FA;--line:#E3E7EC;--line2:#CBD3DC;--fg:#171C23;--muted:#4F5B68;--dim:#7A8592;
  --acc:#344B63;--acc-grad:linear-gradient(130deg,#344B63,#171C23);--on-acc:#FFFFFF;--acc-ink:#344B63;--acc-soft:#E6ECF2;
  --ok:#1F8A5B;--ok-bg:#E6F4EC;--warn:#A86A12;--warn-bg:#FBF0DC;--bad:#BE3B34;--bad-bg:#FBE7E5;--info:#2A66A8;--info-bg:#E5EEF8;--vio:#6A4FC2;--vio-bg:#EEE9FB;
  --top:rgba(255,255,255,.94);--shadow:0 10px 40px rgba(23,28,35,.18);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ===== Barra de cima ===== */
.topbar{position:sticky;top:0;z-index:30;background:var(--top);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.topbar-in{height:58px;display:flex;align-items:center;gap:4px;padding:0 10px;max-width:1400px;margin:auto}
.ib{all:unset;cursor:pointer;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--muted);position:relative}
.ib:hover{background:var(--card2);color:var(--fg)}
.ib .badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.top-brand{display:none;align-items:center;gap:10px;font-family:var(--fh);font-size:21px;font-weight:700;letter-spacing:.5px}
.top-brand img{height:34px;border-radius:6px}
.spacer{flex:1}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--fg);cursor:pointer}

/* ===== Menu lateral ===== */
.drawer-scrim{position:fixed;inset:0;background:rgba(5,8,12,.6);z-index:50}
.side{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--card);z-index:51;border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:var(--safe-t);transform:translateX(-102%);transition:transform .22s ease}
.side.open{transform:none}
.side-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.side-h img{height:40px;border-radius:7px}
.side-h b{font-family:var(--fh);font-size:22px;letter-spacing:.4px;line-height:1}
.side-h small{display:block;font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:700}
.side-b{overflow-y:auto;padding:8px 10px calc(20px + var(--safe-b))}
.side-sec{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--dim);padding:16px 12px 6px}
.side-b button{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;padding:11px 12px;border-radius:9px;color:var(--fg);font-size:15px}
.side-b button:hover{background:var(--card2)}
.side-b button[aria-current="page"]{background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.side-b button svg{color:var(--muted)}
.side-b button[aria-current="page"] svg{color:var(--acc-ink)}

/* ===== Barra de baixo ===== */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--top);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:4px 2px calc(4px + var(--safe-b))}
.bottom button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:11px;color:var(--dim);position:relative;min-width:0}
.bottom button[aria-current="page"]{color:var(--acc-ink);font-weight:600}
.bottom button[aria-current="page"]::before{content:"";position:absolute;top:-4px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--acc-ink)}
.bottom button svg.i{width:23px;height:23px}
.bottom .dotc{position:absolute;top:4px;left:56%;min-width:15px;height:15px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ===== Conteúdo ===== */
main{max-width:1400px;margin:auto;padding:20px 18px calc(100px + var(--safe-b))}
.ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.ph .back{margin-left:-8px;margin-top:4px}
.ph h1{font-family:var(--f);font-size:28px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.4px}
.ph p{margin:4px 0 0;color:var(--muted);font-size:15px}
.ph .grow{flex:1;min-width:0}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:46px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc-grad);color:var(--on-acc);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ok{color:var(--ok)}
.btn svg.i{width:19px;height:19px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -18px 18px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:12px 10px;color:var(--muted);font-size:15px;white-space:nowrap;position:relative;display:flex;align-items:center;gap:6px}
.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--acc-ink)}
.tabs .tdot{width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor}

.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.monthnav .ib{width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.monthpick{position:relative;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);min-width:170px;cursor:pointer}
.monthpick span{flex:1}
.monthpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;align-items:flex-start;gap:14px;min-width:0}
.stat .grow{flex:1;min-width:0}
.stat .l{color:var(--muted);font-size:15px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .s{color:var(--dim);font-size:13px;margin-top:4px}
.stat .ok-line{color:var(--ok);font-size:14px;margin-top:8px;display:flex;gap:6px}
.tile{width:52px;height:52px;border-radius:11px;display:grid;place-items:center;flex:none}
.tile svg.i{width:24px;height:24px}
.t-acc{background:var(--acc-soft);color:var(--acc-ink)}.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-vio{background:var(--vio-bg);color:var(--vio)}
.stat.left{flex-direction:row}
.stat .act{margin-top:12px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.mini div{display:flex;gap:10px;align-items:flex-start;min-width:0}
.mini .l{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

.box{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;min-width:0}
.box-h{display:flex;align-items:center;gap:10px;padding:18px 22px 6px;flex-wrap:wrap}
.box-h h2{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.box-h h2 svg{color:var(--acc-ink)}
.box-h .grow{flex:1}
.box-b{padding:14px 22px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.box{margin-bottom:0}
.empty{padding:28px 10px;text-align:center;color:var(--dim)}
.empty svg.i{width:40px;height:40px;stroke-width:1.4;margin-bottom:8px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px;font-weight:600}

.f{display:flex;flex-direction:column;gap:7px;min-width:0;margin-bottom:14px}
.f label{font-size:14px;color:var(--muted)}
.f label i{color:var(--bad);font-style:normal}
.input,select.input,textarea.input{width:100%;min-width:0;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font-size:16px}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.input:focus{outline:none;border-color:var(--acc)}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim)}
.searchbox .input{padding-left:44px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.seg .chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px}
.seg .chip[aria-pressed="true"]{background:var(--acc-grad);color:var(--on-acc);border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* listas de serviço */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;cursor:pointer;min-width:0}
.item:hover{border-color:var(--line2)}
.item .grow{flex:1;min-width:0}
.item .t1{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .t2{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{text-align:right;flex:none}
.item .val b{display:block;font-variant-numeric:tabular-nums}
.item .sel{width:22px;height:22px;accent-color:var(--acc);margin-top:2px;flex:none}
.code{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
.p-warn{background:var(--warn-bg);color:var(--warn)}.p-info{background:var(--info-bg);color:var(--info)}.p-ok{background:var(--ok-bg);color:var(--ok)}.p-vio{background:var(--vio-bg);color:var(--vio)}.p-off{background:var(--card2);color:var(--dim)}.p-bad{background:var(--bad-bg);color:var(--bad)}
.paid{font-size:12px;color:var(--ok)}.unpaid{font-size:12px;color:var(--warn)}

.rank{display:flex;flex-direction:column}
.rank div{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank div:last-child{border-bottom:0}
.rank .pos{width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.rank .grow{flex:1;min-width:0}
.rank .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rank .grow span{font-size:13px;color:var(--dim)}

.kanban{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kcol h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.kcol .list{gap:8px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.r{text-align:right}
tfoot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font-size:10px;font-family:var(--f)}
.chart .gl{stroke:var(--line)}
.chart .b{fill:var(--acc)}
.mapframe{width:100%;height:340px;border:0;border-radius:10px;background:var(--card2)}

/* modal (folha de baixo no celular) */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.6);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:var(--card);z-index:61;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet form{display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:19px;flex:1}
.sheet-h small{display:block;color:var(--dim);font-size:12.5px;font-weight:600}
.sheet-b{overflow-y:auto;padding:16px 18px}
.sheet-f{padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet-f .btn.primary{flex:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fg .full{grid-column:1/-1}
.sec{grid-column:1/-1;font-size:12px;letter-spacing:1.4px;font-weight:700;color:var(--dim);margin:6px 0 12px;padding-top:12px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:0}
.calc{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;background:var(--card2);border-radius:9px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:14px}
.calc b{color:var(--fg)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--line2);cursor:pointer;transition:.2s}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--acc)}
.switch input:checked+span::before{transform:translateX(22px)}

.pop{position:fixed;top:calc(62px + var(--safe-t));right:10px;width:min(360px,calc(100% - 20px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:55}
.pop h3{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.pop .pi{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.pop .pi:hover{background:var(--card2)}
.pop .pi small{display:block;color:var(--dim)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(84px + var(--safe-b));max-width:420px;margin:auto;background:var(--card);border:1px solid var(--line);color:var(--fg);padding:14px 16px;border-radius:12px;z-index:70;box-shadow:var(--shadow)}
.toast b{display:block;margin-bottom:2px}
.toast.bad{border-color:var(--bad)}
.note{font-size:13px;color:var(--dim)}
.profile{display:flex;align-items:center;gap:18px}
.profile .big{width:76px;height:76px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none;overflow:hidden}
.profile .big img{width:100%;height:100%;object-fit:cover}
.profile h2{font-size:26px;margin:0;line-height:1.1}
.tagadm{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:var(--card2);border-radius:6px;padding:3px 9px;margin-top:6px}

@media(min-width:1000px){
  .side{transform:none;top:0;width:260px;transition:none}
  .drawer-scrim{display:none}
  .topbar,main{margin-left:260px}
  .topbar-in{max-width:none}
  main{max-width:1200px;padding:28px 34px 60px}
  .bottom{display:none}
  .menu-btn{display:none}
  .tabs{margin:0 0 18px;padding:0}
  .sheet{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%);width:min(760px,calc(100% - 40px));border-radius:16px;max-height:90vh}
  .toast{bottom:24px}
}
@media(max-width:999px){.grid2{grid-template-columns:1fr}.grid2>.box{margin-bottom:0}}
@media(max-width:560px){.fg,.checks{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.stat .v{font-size:26px}.ph h1{font-size:26px}}
@media print{.topbar,.bottom,.side,.btn,.monthnav,.tabs,.no-print{display:none!important}main{margin:0!important;padding:0!important}body{background:#fff;color:#000}.box,.stat{border-color:#ccc;background:#fff}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="ib menu-btn" data-act="menu" aria-label="Abrir menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

const somaMes=(ym,d)=>{let[a,m]=ym.split("-").map(Number);m+=d;while(m<1){m+=12;a--;}while(m>12){m-=12;a++;}return a+"-"+pad(m);};
const placaFmt=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const digits=s=>String(s||"").replace(/\D/g,"");

let D=VAZIO();
function carregar(){
  try{
    const raw=localStorage.getItem(CHAVE);
    if(raw){const d=JSON.parse(raw);D=Object.assign(VAZIO(),d);D.seq=Object.assign(VAZIO().seq,d.seq||{});D.empresa=Object.assign({},EMPRESA_PADRAO,d.empresa||{});return;}
    const v1=localStorage.getItem(CHAVE_V1);
    if(v1){const o=JSON.parse(v1);D.servicos=(o.os||[]).map(x=>Object.assign({},x,{numero:(x.numero||"").replace("OS-","S-")}));D.clientes=o.clientes||[];D.motoristas=(o.motoristas||[]).map(m=>Object.assign({},m,{tipo:m.tipo==="PARCEIRO"?"CONTRATADO":"PROPRIO"}));D.veiculos=o.veiculos||[];D.seq.servico=o.seq||D.servicos.length;salvar();}
  }catch(_){}
}
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(D));return true;}catch(_){toast("Não foi possível salvar","O armazenamento do aparelho está cheio. Apague fotos de checklists antigos ou faça backup.","bad");return false;}}
const by=(col,id)=>D[col].find(x=>x.id===id);

const motNome=x=>(by("motoristas",x.motoristaId)||{}).nome||"";
const veiNome=x=>{const v=by("veiculos",x.veiculoFrotaId);return v?v.descricao+(v.placa?" · "+v.placa:""):"";};
const valido=s=>s.status!=="CANCELADA";
const custo=s=>numIn(s.combustivel)+numIn(s.pedagio)+numIn(s.repasse)+numIn(s.outrasDespesas);
const servMes=ym=>D.servicos.filter(s=>(s.dataHora||"").slice(0,7)===ym);
const cliPJ=s=>{const c=by("clientes",s.clienteId);return c&&c.tipoPessoa==="JURIDICA";};
const proxNum=(k,pre)=>{D.seq[k]=(D.seq[k]||0)+1;return pre+String(D.seq[k]).padStart(4,"0");};
const loteTotal=l=>(l.servicoIds||[]).map(id=>by("servicos",id)).filter(Boolean).reduce((a,s)=>a+numIn(s.valor),0);
const nfLiq=n=>numIn(n.valorBruto)-numIn(n.retencoes);

/* ================= Estado de tela ================= */
const S={view:"servicos",sub:"dash",mes:mesAtual(),busca:"",fStatus:"",fTipo:"",fMot:"",selecionar:false,sel:new Set(),

function toast(t,msg,kind){const el=$("#toast");el.innerHTML=`<b>${esc(t)}</b>${msg?esc(msg):""}`;el.className="toast"+(kind==="bad"?" bad":"");el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,3600);}
function beep(){if(!D.som)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.18);}catch(_){}}

/* ================= Tema ================= */

function ir(v){const[a,b]=v.split(":");const antes=S.view;S.view=a;if(a==="servicos")S.sub=b||(antes==="servicos"?"dash":S.sub==="lotes"||S.sub==="notas"?"dash":S.sub);S.menu=false;S.notif=false;S.selecionar=false;S.sel.clear();render();window.scrollTo(0,0);}

  return `<div class="item" ${S.selecionar?`data-toggle="${s.id}"`:`data-open-s="${s.id}"`}>${chk}<div class="grow">

    <div class="t2">${TIPOS[s.tipo]||""} · ${esc(s.veiculoModelo||"")} ${s.veiculoPlaca?"· "+esc(s.veiculoPlaca):""}${s.protocolo?" · Prot. "+esc(s.protocolo):""}</div>
    <div class="t2">${fmtDH(s.dataHora)} · ${esc(s.origem||"")}${s.destino?" → "+esc(s.destino):""}</div></div>
    <div class="val"><b>${numIn(s.valor)?brl(s.valor):'<span class="unpaid">Sem valor</span>'}</b>${s.status==="CANCELADA"||!numIn(s.valor)?"":s.pago?'<span class="paid">Recebido</span>':'<span class="unpaid">A receber</span>'}${s.loteId?`<div class="note">${esc((by("lotes",s.loteId)||{}).numero||"")}</div>`:""}</div></div>`;

/* ================= Dashboard geral ================= */

   +`<div class="grid2"><section class="box"><div class="box-h"><h2>${I("radio")}Acionamentos ativos</h2><div class="grow"></div><button class="btn sm ghost" data-go="acionamentos">Ver →</button></div><div class="box-b">${ativos.length?`<div class="list">${ativos.map(itemAci).join("")}</div>`:empty("radio","","Nenhum acionamento ativo")}</div></section>

   +`<section class="box"><div class="box-h"><h2>${I("truck")}Últimos serviços</h2><div class="grow"></div><button class="btn sm ghost" data-go="servicos:lista">Ver todos →</button></div><div class="box-b">${ult.length?`<div class="list">${ult.map(itemServ).join("")}</div>`:empty("truck","Nenhum serviço ainda","Toque em Novo Serviço para registrar o primeiro.")}</div></section>`;

/* ================= Serviços ================= */
function vServicos(){
  const head=S.sub==="lotes"?ph("Lotes de Serviços","Agrupe serviços não pagos por cliente para emissão de notas fiscais","servicos:dash")
   :S.sub==="notas"?ph("Notas Fiscais","Gerenciamento de notas fiscais enviadas","servicos:dash")
   :ph("Serviços","Gerenciamento de serviços realizados");
  const acts=S.sub==="lotes"?`<div class="ph-actions"><button class="btn" data-act="sync">${I("sync")}Sincronizar</button><button class="btn primary" data-act="novo-lote">${I("plus")}Novo Lote</button></div>`
   :S.sub==="notas"?`<div class="ph-actions"><button class="btn primary block" data-act="nova-nf">${I("plus")}Nova Nota Fiscal</button></div>`
   :`<div class="ph-actions"><button class="btn primary" data-act="novo-serv">${I("plus")}Novo Serviço</button></div>`;
  const body={dash:vServDash,lista:vServLista,lotes:vLotes,notas:vNotas}[S.sub]||vServDash;
  return head+acts+subtabs()+body();
}
function topRank(list,keyFn){const m=new Map();list.forEach(s=>{const k=keyFn(s);if(!k)return;const g=m.get(k)||{n:0,v:0};g.n++;g.v+=numIn(s.valor);m.set(k,g);});return[...m.entries()].sort((a,b)=>b[1].v-a[1].v).slice(0,5);}
const rankHTML=(rows,ic,vazio)=>rows.length?`<div class="rank">${rows.map(([k,g],i)=>`<div><span class="pos">${i+1}</span><div class="grow"><b>${esc(k)}</b><span>${g.n} serviço(s)</span></div><b class="num">${brl(g.v)}</b></div>`).join("")}</div>`:empty(ic,"",vazio);
function vServDash(){
  const ym=S.mes,mes=servMes(ym).filter(valido);
  const fat=mes.reduce((a,s)=>a+numIn(s.valor),0);
  const semValor=mes.filter(s=>!numIn(s.valor)).length;
  const pend=mes.filter(s=>numIn(s.valor)&&!s.pago).length;
  const semFech=mes.filter(s=>cliPJ(s)&&!s.loteId&&!s.pago);
  const motTipo=t=>s=>{const m=by("motoristas",s.motoristaId);return m&&m.tipo===t?m.nome:"";};

  return monthnav("mes-serv",ym)
   +`<div class="cards">${stat("Serviços do Mês",mes.length,"t-acc","truck")}${stat("Faturamento do Mês",brl(fat),"t-ok","trend")}
     ${stat("Serviços sem valor",semValor,"t-warn","alert",`<div class="act"><button class="btn sm block" data-act="ver-semvalor">${I("filter")}Ver serviços</button></div>`)}
     ${stat("Pagamentos Pendentes",pend,"t-bad","wallet",pend?`<div class="s">${brl(mes.filter(s=>!s.pago).reduce((a,s)=>a+numIn(s.valor),0))} a receber</div>`:"")}
     ${stat("Serviços sem fechamento",semFech.length,"t-vio","bank",`<div class="s">De assistências e empresas, ainda sem fechamento de lote no mês.</div>${semFech.length?`<div class="act"><button class="btn sm block" data-act="lote-auto">${I("layers")}Fechar lotes do mês</button></div>`:`<div class="ok-line">${I("tick")}Todos os serviços do mês foram fechados.</div>`}`)}</div>`
   +`<div class="grid2"><section class="box"><div class="box-h"><h2>${I("building")}Top Faturamento Clientes</h2></div><div class="box-b">${rankHTML(topRank(mes,cliNome),"building","Nenhum serviço no mês")}</div></section>
     <section class="box"><div class="box-h"><h2>${I("user")}Top Faturamento Colaboradores</h2></div><div class="box-b">${rankHTML(topRank(mes,motTipo("PROPRIO")),"user","Nenhum colaborador com serviço")}</div></section>
     <section class="box"><div class="box-h"><h2>${I("user")}Top Faturamento Contratados</h2></div><div class="box-b">${rankHTML(topRank(mes,motTipo("CONTRATADO")),"user","Nenhum motorista contratado")}</div></section>
     <section class="box"><div class="box-h"><h2>${I("truck")}Top Faturamento Agregados</h2></div><div class="box-b">${rankHTML(topRank(mes,motTipo("AGREGADO")),"truck","Nenhum motorista agregado")}</div></section></div><div style="height:16px"></div>`
   +`<section class="box"><div class="box-h"><h2>${I("user")}Consultar por Motorista</h2></div><div class="box-b"><div class="f"><label for="cons-mot">Selecione o motorista</label><select class="input" id="cons-mot"><option value="">Todos os motoristas</option>${D.motoristas.map(m=>`<option value="${m.id}" ${S.consMot===m.id?"selected":""}>${esc(m.nome)}</option>`).join("")}</select></div>
     ${S.consMot?(motSel.length?`<div class="cards" style="margin-bottom:12px">${statL("Serviços",motSel.length,"t-acc","truck")}${statL("Faturado",brl(motSel.reduce((a,s)=>a+numIn(s.valor),0)),"t-ok","money")}${statL("Repasse",brl(motSel.reduce((a,s)=>a+numIn(s.repasse),0)),"t-warn","wallet")}</div><div class="list">${motSel.map(itemServ).join("")}</div>`:empty("user","","Nenhum serviço deste motorista no mês")):empty("user","","Selecione um motorista para ver suas informações")}</div></section>`;
}
function filtrarServ(){const q=norm(S.busca);return servMes(S.mes).filter(s=>(!S.fStatus||(S.fStatus==="SEM_VALOR"?!numIn(s.valor)&&valido(s):S.fStatus==="A_RECEBER"?valido(s)&&!s.pago&&numIn(s.valor):s.status===S.fStatus))&&(!S.fTipo||s.tipo===S.fTipo)&&(!S.fMot||s.motoristaId===S.fMot)&&(!q||norm([s.numero,cliNome(s),s.solicitante,s.veiculoModelo,s.veiculoPlaca,s.protocolo,s.origem,s.destino,motNome(s)].join(" ")).includes(q))).sort((a,b)=>(b.dataHora||"").localeCompare(a.dataHora||""));}

   +(list.length?`<div class="list">${list.map(itemServ).join("")}</div>`:`<section class="box">${empty("truck","Nenhum serviço encontrado",D.servicos.length?"Ajuste o mês ou os filtros.":"Toque em Novo Serviço para registrar o primeiro.")}</section>`);
}

   <div class="row" style="margin-bottom:14px">${I("filter")}<select class="input" id="lote-st" style="width:auto;min-width:160px">${opt(Object.fromEntries(Object.entries(ST_LOTE).map(([k,v])=>[k,v[0]])),S.loteSt,"Todos")}</select></div>`
   +(list.length?`<div class="list">${list.map(l=>{const nf=by("notas",l.notaId);return`<div class="item" data-open-lote="${l.id}"><div class="tile t-vio" style="width:44px;height:44px">${I("layers")}</div><div class="grow"><div class="t1"><span class="code">${esc(l.numero)}</span>${esc(cliNome(l))} ${pill(ST_LOTE,l.status)}</div><div class="t2">${(l.servicoIds||[]).length} serviço(s) · ${esc(l.referencia||"")}${nf?" · NF "+esc(nf.numero):""}</div><div class="t2">Criado em ${fmtD(l.criadoEm)}</div></div><div class="val"><b>${brl(loteTotal(l))}</b></div></div>`;}).join("")}</div>`

   <div class="t2">${TIPOS[a.tipo]||""} · ${esc(a.veiculoModelo||"")} ${a.veiculoPlaca?"· "+esc(a.veiculoPlaca):""}${a.protocolo?" · Prot. "+esc(a.protocolo):""}</div>
   <div class="t2">${I("pin").replace('class="i "','class="i" style="width:14px;height:14px;vertical-align:-2px"')} ${esc(a.origem||"")}${a.destino?" → "+esc(a.destino):""}</div>
   <div class="t2">${motNome(a)?esc(motNome(a))+" · ":""}${a.status==="CONCLUIDO"||a.status==="CANCELADO"?fmtDH(a.criadoEm):"há "+tempo(m)}</div></div>

  const concl=D.acionamentos.filter(a=>(a.status==="CONCLUIDO"||a.status==="CANCELADO")&&f(a)).sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""));

  const fatDia=D.servicos.filter(s=>valido(s)&&(s.dataHora||"").slice(0,10)===h).reduce((a,s)=>a+numIn(s.valor),0);
  const ocupados=new Set(D.acionamentos.filter(a=>a.status==="EM_ANDAMENTO").map(a=>a.motoristaId));
  const livres=D.motoristas.filter(m=>!ocupados.has(m.id)&&m.ativo!==false);
  const conteudo=S.aciAba==="mapa"?vMapa(ativos):S.aciAba==="concluidos"?(concl.length?`<div class="list">${concl.slice(0,60).map(itemAci).join("")}</div>`:empty("check","","Nenhum acionamento concluído"))
   :!ativos.length?empty("radio","Nenhum acionamento ativo",'Clique em "Novo Acionamento" para começar')
   :S.aciModo==="kanban"?`<div class="kanban">${[["PENDENTE","Pendentes"],["EM_ANDAMENTO","Em andamento"]].map(([k,l])=>{const c=ativos.filter(a=>a.status===k);return`<div class="kcol"><h3>${l}<span>${c.length}</span></h3><div class="list">${c.map(itemAci).join("")||'<div class="note">—</div>'}</div></div>`;}).join("")}<div class="kcol"><h3>Concluídos hoje<span>${doDia.filter(a=>a.status==="CONCLUIDO").length}</span></h3><div class="list">${doDia.filter(a=>a.status==="CONCLUIDO").map(itemAci).join("")||'<div class="note">—</div>'}</div></div></div>`
   :S.aciModo==="lista"?`<div class="tbl-wrap box"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Placa</th><th>Local</th><th>Motorista</th><th>Status</th><th class="r">Tempo</th></tr></thead><tbody>${ativos.map(a=>`<tr data-open-a="${a.id}" style="cursor:pointer"><td class="code">${esc(a.numero)}</td><td>${esc(cliNome(a))}</td><td>${esc(a.veiculoPlaca||"")}</td><td>${esc(a.origem||"")}</td><td>${esc(motNome(a))}</td><td>${pill(ST_ACI,a.status)}</td><td class="r num">${tempo(minDesde(a.criadoEm))}</td></tr>`).join("")}</tbody></table></div>`
   :`<div class="list">${ativos.map(itemAci).join("")}</div>`;
  return `<div class="row" style="margin-bottom:14px">${I("sound")}<label class="switch"><input type="checkbox" id="som" ${D.som?"checked":""} aria-label="Som de alerta"><span></span></label><button class="ib" data-act="refresh" aria-label="Atualizar">${I("sync")}</button></div>`
   +`<div class="ph-actions"><button class="btn primary" data-act="novo-aci">${I("plus")}Novo Acionamento</button></div>`

function agrupar(list,keyFn){const m=new Map();list.forEach(s=>{const k=keyFn(s)||"—";const g=m.get(k)||{n:0,v:0,c:0,r:0,rep:0};g.n++;g.v+=numIn(s.valor);g.c+=custo(s);g.rep+=numIn(s.repasse);if(!s.pago)g.r+=numIn(s.valor);m.set(k,g);});return[...m.entries()].sort((a,b)=>b[1].v-a[1].v);}
function tabAgg(t,col,rows){return`<section class="box"><div class="box-h"><h2>${t}</h2></div><div class="box-b">${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>${col}</th><th class="r">Qtd</th><th class="r">Valor</th><th class="r">Despesas</th><th class="r">Lucro</th><th class="r">A receber</th></tr></thead><tbody>${rows.map(([k,g])=>`<tr><td><b>${esc(k)}</b></td><td class="r num">${g.n}</td><td class="r num">${brl(g.v)}</td><td class="r num">${brl(g.c)}</td><td class="r num">${brl(g.v-g.c)}</td><td class="r num">${g.r?brl(g.r):"—"}</td></tr>`).join("")}</tbody></table></div>`:empty("bars","","Sem serviços no mês")}</div></section>`;}
function grafDias(list,ym){const[a,m]=ym.split("-").map(Number),dias=new Date(a,m,0).getDate(),v=Array(dias).fill(0);list.forEach(s=>{const d=+(s.dataHora||"").slice(8,10);if(d)v[d-1]+=numIn(s.valor);});const max=Math.max(1,...v),W=720,H=170,pb=20,bw=W/dias;let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por dia">`;[.5,1].forEach(f=>{const y=H-pb-(H-pb-8)*f;o+=`<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;});v.forEach((x,i)=>{const h=(H-pb-8)*x/max;o+=`<rect class="b" x="${i*bw+2}" y="${H-pb-h}" width="${Math.max(2,bw-4)}" height="${h}" rx="2"><title>${pad(i+1)}/${pad(m)}: ${brl(x)}</title></rect>`;if((i+1)%5===0||i===0)o+=`<text x="${i*bw+bw/2}" y="${H-5}" text-anchor="middle">${i+1}</text>`;});return o+"</svg>";}

  const ant=servMes(somaMes(ym,-1)).filter(valido).reduce((a,s)=>a+numIn(s.valor),0);

   +`<div class="ph-actions"><button class="btn" data-act="print">${I("print")}Imprimir / PDF</button><button class="btn primary" data-act="csv-rel">${I("dl")}Exportar Excel</button></div>`+monthnav("mes-rel",ym)
   +`<div class="cards">${stat("Serviços",list.length,"t-acc","truck",todos.length-list.length?`<div class="s">${todos.length-list.length} cancelado(s)</div>`:"")}${stat("Faturamento",brl(fat),"t-vio","trend",ant?`<div class="s">${fat>=ant?"▲":"▼"} ${Math.abs(Math.round((fat-ant)/ant*100))}% vs mês anterior</div>`:"")}${stat("Despesas",brl(cus),"t-bad","wallet",'<div class="s">Combustível, pedágio, repasse e outras</div>')}${stat("Lucro",brl(fat-cus),"t-ok","money",fat?`<div class="s">${Math.round((fat-cus)/fat*100)}% de margem</div>`:"")}${stat("Recebido",brl(rec),"t-info","check")}${stat("A receber",brl(fat-rec),"t-warn","clock",list.length?`<div class="s">Ticket médio ${brl(fat/list.length)}${km?" · "+km.toLocaleString("pt-BR")+" km":""}</div>`:"")}</div>`
   +`<section class="box"><div class="box-h"><h2>Faturamento por dia</h2></div><div class="box-b">${grafDias(list,ym)}</div></section>`
   +`<div class="grid2">${tabAgg("Por tipo de serviço","Serviço",agrupar(list,s=>TIPOS[s.tipo]))}${tabAgg("Por cliente","Cliente",agrupar(list,cliNome))}${tabAgg("Por forma de pagamento","Pagamento",agrupar(list,s=>PAGTO[s.formaPagamento]))}${tabAgg("Por motorista","Motorista",agrupar(list,s=>motNome(s)||"Não atribuído"))}</div>`;

   ${fi(ex||{referencia:nomeMes(S.mes).replace(/^./,c=>c.toUpperCase())},"referencia","Referência")}

   <div class="sec">SERVIÇOS NÃO PAGOS DO CLIENTE</div>

function loteTot(){const el=$("#lote-tot");if(!el)return;const ids=[...document.querySelectorAll("[data-lote-sv]:checked")].map(x=>x.value);el.innerHTML=`<span>Serviços <b>${ids.length}</b></span><span>Total do lote <b>${brl(ids.reduce((a,id)=>a+numIn((by("servicos",id)||{}).valor),0))}</b></span>`;}
function salvarLote(form){
  const ids=[...form.querySelectorAll("[data-lote-sv]:checked")].map(x=>x.value);
  const cli=MODAL.id?by("lotes",MODAL.id).clienteId:form.querySelector("[name=clienteId]").value;
  if(!cli){toast("Escolha o cliente","","bad");return;}if(!ids.length){toast("Marque ao menos um serviço","","bad");return;}
  const ref=form.querySelector("[name=referencia]").value.trim();let l;
  if(MODAL.id){l=by("lotes",MODAL.id);(l.servicoIds||[]).forEach(id=>{const s=by("servicos",id);if(s&&s.loteId===l.id)s.loteId=null;});l.servicoIds=ids;l.referencia=ref;}
  else{l={id:uid("l_"),numero:proxNum("lote","L-"),clienteId:cli,servicoIds:ids,referencia:ref,status:"ABERTO",criadoEm:agora()};D.lotes.push(l);}
  ids.forEach(id=>{const s=by("servicos",id);if(s)s.loteId=l.id;});
  salvar();fechar();toast("Lote salvo",l.numero+" · "+brl(loteTotal(l)));render();
}
function lotesAuto(){
  const pend=servMes(S.mes).filter(s=>valido(s)&&cliPJ(s)&&!s.loteId&&!s.pago);const g=new Map();pend.forEach(s=>{(g.get(s.clienteId)||g.set(s.clienteId,[]).get(s.clienteId)).push(s.id);});
  g.forEach((ids,c)=>{const l={id:uid("l_"),numero:proxNum("lote","L-"),clienteId:c,servicoIds:ids,referencia:nomeMes(S.mes).replace(/^./,x=>x.toUpperCase()),status:"ABERTO",criadoEm:agora()};D.lotes.push(l);ids.forEach(id=>by("servicos",id).loteId=l.id);});
  salvar();toast("Lotes criados",g.size+" lote(s) para "+nomeMes(S.mes));S.sub="lotes";render();

function sincronizar(){let n=0;D.lotes.forEach(l=>{const nf=by("notas",l.notaId);const novo=!nf||nf.status==="CANCELADA"?"ABERTO":nf.status==="PAGA"?"PAGO":"FATURADO";if(novo!==l.status){l.status=novo;n++;}if(novo==="PAGO")(l.servicoIds||[]).forEach(id=>{const s=by("servicos",id);if(s){s.pago=true;if(s.status==="CONCLUIDA")s.status="FATURADA";}});else if(novo==="FATURADO")(l.servicoIds||[]).forEach(id=>{const s=by("servicos",id);if(s&&s.status==="CONCLUIDA")s.status="FATURADA";});});salvar();render();toast("Sincronização concluída",n+" lote(s) atualizado(s).");}

/* --- Excluir --- */
function excluir(col,id){
  if(col==="clientes"||col==="motoristas"||col==="veiculos"){const campo=CAD[col].uso;if(D.servicos.some(s=>s[campo]===id)||D.acionamentos.some(s=>s[campo]===id)){toast("Não é possível excluir","Este cadastro já está em serviços ou acionamentos.","bad");return false;}}
  if(col==="lotes"){const l=by("lotes",id);(l.servicoIds||[]).forEach(s=>{const x=by("servicos",s);if(x&&x.loteId===id)x.loteId=null;});const nf=by("notas",l.notaId);if(nf)nf.loteId="";}
  if(col==="notas"){D.lotes.forEach(l=>{if(l.notaId===id){l.notaId=null;l.status="ABERTO";}});}
  if(col==="servicos"){D.lotes.forEach(l=>l.servicoIds=(l.servicoIds||[]).filter(x=>x!==id));D.acionamentos.forEach(a=>{if(a.servicoId===id)a.servicoId=null;});}
  D[col]=D[col].filter(x=>x.id!==id);salvar();toast("Excluído","");return true;
}

  else if(id==="f-st"){S.fStatus=v;render();}else if(id==="f-tipo"){S.fTipo=v;render();}else if(id==="f-mot"){S.fMot=v;render();}
  else if(id==="cons-mot"){S.consMot=v;render();}else if(id==="lote-st"){S.loteSt=v;render();}else if(id==="nf-per"){S.nfPeriodo=v;render();}else if(id==="nf-st"){S.nfSt=v;render();}
  else if(id==="som"){D.som=t.checked;salvar();}
  else if(id==="pref-tema"){const n=t.checked?"dark":"light";try{localStorage.setItem(CHAVE_TEMA,n);}catch(_){}aplicarTema(n);}
  else if(id==="restore")restaurar(t);
  else if(t.hasAttribute("data-lote-cli")){formLote(null,null,v);}
  else if(t.hasAttribute("data-lote-sv"))loteTot();
  else if(id==="fotos-in"){const fs=[...t.files].slice(0,8-(MODAL.fotos||[]).length);for(const f of fs){try{MODAL.fotos.push(await reduzir(f));}catch(_){toast("Não foi possível ler a foto","","bad");}}thumbs();t.value="";}
  else if(id==="m-clienteId"&&t.closest("#form-nf")){}
});
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id;
  if(id==="form-serv")salvarServ(e.target);else if(id==="form-aci")salvarAci(e.target);else if(id==="form-lote")salvarLote(e.target);else if(id==="form-nf")salvarNF(e.target);else if(id==="form-chk")salvarChk(e.target);else if(id==="form-cad")salvarCad(e.target);
  else if(id==="form-emp"){Object.assign(D.empresa,lerForm(e.target));salvar();toast("Informações salvas","");render();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(MODAL||$("#overlay").innerHTML)fechar();else if(S.menu){S.menu=false;render();}}});
setInterval(()=>{if(!MODAL&&S.view==="acionamentos"&&!document.activeElement.matches("input,select,textarea"))render();},60000);

aplicarTema(tema());carregar();render();
})();
</script>
</body>
</html>
